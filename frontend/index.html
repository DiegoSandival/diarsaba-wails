<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <!-- Política de seguridad: diarsaba vive dentro de sí. connect-src 'self'
         corta que el webview llegue a internet (fetch/XHR/WebSocket externos),
         que es el canal de exfiltración más obvio. El p2p NO se afecta: va por
         los bindings de Go, no por la red del webview.
         'unsafe-eval' es obligatorio — todo el programa es new Function()—, así
         que el CSP aquí protege la RED, no los scripts (esa es la debilidad
         inherente de un entorno de programación viva). worker-src blob: lo pide
         Monaco. (La IA se acotó aparte: ver AIEditAtom — sale por Go con config
         fija, así que el CSP no necesita cubrirla.) -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIARSABA</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="/fa/css/all.min.css">
    <script src="/vs/loader.js"></script>

    <style>
        /* --- UI del asistente de IA ---
           Monocromo, igual que el resto: hereda las variables de
           «todo el estilo {». Aquí no se declaran colores propios. */
        .editor-modal { position: relative; }

        .ai-button {
            border: 1px solid var(--graph-border);
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.08);
            color: var(--graph-text);
            padding: 6px 12px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
            font-family: inherit;
        }

        .ai-button:hover {
            background: rgba(255, 255, 255, 0.18);
            border-color: var(--graph-border-active);
        }
        .ai-button:disabled { opacity: 0.6; cursor: default; }

        .ai-prompt {
            position: absolute;
            left: 50%;
            bottom: 18px;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            align-items: center;
            width: min(560px, 82%);
            padding: 8px;
            border-radius: 12px;
            background: var(--graph-bg-strong);
            border: 1px solid var(--graph-border);
            box-shadow: 0 18px 48px rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            z-index: 10;
        }

        .ai-prompt-input {
            flex: 1;
            border: 1px solid rgba(255, 255, 255, 0.1);
            outline: none;
            padding: 8px 10px;
            border-radius: 8px;
            color: var(--graph-text);
            background: rgba(255, 255, 255, 0.06);
            font-family: inherit;
            font-size: 0.95rem;
        }

        .ai-prompt-input:focus { border-color: rgba(255, 255, 255, 0.55); }

        .ai-prompt-send {
            border: 1px solid rgba(255, 255, 255, 0.38);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.2);
            color: var(--graph-text);
            padding: 8px 12px;
            cursor: pointer;
            transition: background 0.2s ease;
            font-family: inherit;
        }

        .ai-prompt-send:hover { background: rgba(255, 255, 255, 0.3); }
    </style>

    <script type="module" >
        import { SavePredefinedFunctions, GetAIConfig, AIEditAtom, LoadPredefinedFunctions, ExportAtoms, SetAtom, DeleteAtom, AtomHistory, RestoreAtomVersion } from './wailsjs/go/main/App';
        window.SavePredefinedFunctions = SavePredefinedFunctions;
        // IA: solo AIEditAtom (binding CON PROPÓSITO — edita un átomo de código,
        // con la config FIJA en Go). Ya NO se expone SetAIConfig: la config vive
        // en un archivo que los átomos no pueden reescribir, así que no se puede
        // redirigir el destino ni meter otra key. GetAIConfig es de solo lectura
        // (key enmascarada) para mostrar el estado. Ver la auditoría de seguridad.
        window.AIEditAtom = AIEditAtom;
        window.GetAIConfig = GetAIConfig;
        window.LoadPredefinedFunctions = LoadPredefinedFunctions;
        window.ExportAtoms = ExportAtoms;
        // Autosave granular + historial (ver "persistir atomo ƒ" y "· * restaurar
        // ƒ"). AtomHistory/RestoreAtomVersion quedan en window a propósito: son la
        // vía de recuperación por consola cuando un autosave roto deja la UI sin
        // responder y ya no se puede usar ningún átomo.
        window.SetAtom = SetAtom;
        window.DeleteAtom = DeleteAtom;
        window.AtomHistory = AtomHistory;
        window.RestoreAtomVersion = RestoreAtomVersion;

        // Puente hacia p2plite (ver p2p.go). Va agrupado en window.p2p en vez de
        // sueltas: son 18 y todas del mismo tema. Los ƒ del place "p2p @" son
        // los que le dan forma; esto solo las pone al alcance.
        import * as P2P from './wailsjs/go/main/App';
        import { EventsOn } from './wailsjs/runtime/runtime';
        window.p2p = {
            Start: P2P.P2PStart,
            Stop: P2P.P2PStop,
            ID: P2P.P2PID,
            Addrs: P2P.P2PAddrs,
            FullAddrs: P2P.P2PFullAddrs,
            Peers: P2P.P2PPeers,
            RoutingTableSize: P2P.P2PRoutingTableSize,
            ConnKind: P2P.P2PConnKind,
            ConnIP: P2P.P2PConnIP,
            Announce: P2P.P2PAnnounce,
            StopAnnounce: P2P.P2PStopAnnounce,
            FindProviders: P2P.P2PFindProviders,
            Connect: P2P.P2PConnect,
            OpenStream: P2P.P2POpenStream,
            StreamWrite: P2P.P2PStreamWrite,
            StreamRead: P2P.P2PStreamRead,
            StreamCloseWrite: P2P.P2PStreamCloseWrite,
            StreamClose: P2P.P2PStreamClose,
        };
        window.EventsOn = EventsOn;

        // three.js: SOLO la cámara y la matemática de la escena de chips. No
        // se usa CSS3DRenderer a propósito — un matrix3d con perspectiva
        // remuestrea el texto y pierde el antialiasing; los chips se PROYECTAN
        // a left/top + font-size (billboard, ver el place "3d @"), así el
        // navegador los rasteriza nítidos a su tamaño final. Vite lo empaqueta
        // desde node_modules — sin CDN, como Monaco — y el CSP no cambia.
        import * as THREE from 'three';
        window.THREE = THREE;

        // msgpack: el formato de lo que viaja ENTRE peers. Ojo, no sustituye al
        // base64 — los bindings de Wails vuelven por JSON (dispatcher/calls.go)
        // y encoding/json ya codifica []byte en base64, así que ese salto es
        // inevitable. Lo que aporta msgpack es que por el stream puedan ir
        // objetos, números y binario en vez de solo texto.
        // Vite lo empaqueta desde node_modules: sin CDN, como Monaco.
        import { encode as mpEncode, decode as mpDecode } from '@msgpack/msgpack';
        window.msgpack = { encode: mpEncode, decode: mpDecode };
    </script>

    <script>

       

        const MONACO_BASE_URL = window.location.origin;
        const MONACO_THEME_NAME = "glass-dark";
        // Sin 'color': los iconos heredan currentColor (blanco). El lenguaje ya
        // se distingue por su glifo y por el nombre de al lado; el color de
        // marca era el único punto de color fuera del editor.
        const LANGUAGE_OPTIONS = [
            { id: "html", name: "HTML", icon: "fab fa-html5" },
            { id: "javascript", name: "JavaScript", icon: "fab fa-js-square" },
            { id: "css", name: "CSS", icon: "fab fa-css3-alt" },
            { id: "python", name: "Python", icon: "fab fa-python" },
            { id: "go", name: "Go", icon: "fab fa-golang" },
            // JSON es el lenguaje de los átomos ":" (· : editor ƒ lo pide por
            // nombre). Sin esta entrada Monaco sí resaltaba, pero el selector
            // no lo encontraba y mostraba "JavaScript" en la cabecera.
            { id: "json", name: "JSON", icon: "fas fa-file-code" },
            { id: "plaintext", name: "Texto", icon: "fas fa-file-alt" },
        ];
        const LANGUAGE_ALIAS_MAP = {
            html: "html",
            js: "javascript",
            javascript: "javascript",
            css: "css",
            py: "python",
            python: "python",
            go: "go",
            json: "json",
            text: "plaintext",
            plaintext: "plaintext",
        };
        const MONACO_THEME = {
            base: "vs-dark",
            inherit: true,
            rules: [],
            colors: {
                "editor.background": "#0b0b0b42",
                "editorGutter.background": "#0b0b0b24",
                "editorLineNumber.foreground": "#94a3b8",
                "editorLineNumber.activeForeground": "#f8fafc",
                "editorCursor.foreground": "#f8fafc",
                "editor.selectionBackground": "#ffffff18",
                "editor.inactiveSelectionBackground": "#ffffff10",
                "editor.lineHighlightBackground": "#ffffff08",
                "editor.lineHighlightBorder": "#00000000",
                "editorIndentGuide.background1": "#ffffff12",
                "editorIndentGuide.activeBackground1": "#ffffff22",
                "focusBorder": "#00000000",
                "contrastBorder": "#00000000",
                "contrastActiveBorder": "#00000000",
                "editorWidget.border": "#ffffff12",
                "scrollbarSlider.background": "#ffffff14",
                "scrollbarSlider.hoverBackground": "#ffffff24",
                "scrollbarSlider.activeBackground": "#ffffff30",
            },
        };

        require.config({
            paths: { vs: `${MONACO_BASE_URL}/vs` },
        });

        window.MonacoEnvironment = {
            getWorkerUrl() {
                return `data:text/javascript;charset=utf-8,${encodeURIComponent(`
                self.MonacoEnvironment = {
                    baseUrl: '${MONACO_BASE_URL}/'
                };
                importScripts('${MONACO_BASE_URL}/vs/base/worker/workerMain.js');
            `)}`;
            },
        };

        class CodeEditor {
            constructor() {
                this.isMonacoLoaded = Boolean(window.monaco);
                this.isThemeDefined = false;
                this.monacoLoader = this.loadMonaco();
            }

            loadMonaco() {
                if (window.monaco) {
                    this.isMonacoLoaded = true;
                    return Promise.resolve(window.monaco);
                }

                if (this.monacoLoader && !this.isMonacoLoaded) {
                    return this.monacoLoader;
                }

                this.monacoLoader = new Promise((resolve, reject) => {
                    require(["vs/editor/editor.main"], () => {
                        this.isMonacoLoaded = true;
                        resolve(window.monaco);
                    }, reject);
                });

                return this.monacoLoader;
            }

            getLanguageOption(language) {
                const normalizedLanguage = LANGUAGE_ALIAS_MAP[language] || language;
                return LANGUAGE_OPTIONS.find((option) => option.id === normalizedLanguage)
                    || LANGUAGE_OPTIONS.find((option) => option.id === "javascript");
            }

            getMonacoLanguage(language) {
                return LANGUAGE_ALIAS_MAP[language] || language;
            }

            ensureTheme() {
                if (this.isThemeDefined) {
                    return;
                }

                monaco.editor.defineTheme(MONACO_THEME_NAME, MONACO_THEME);
                this.isThemeDefined = true;
            }

            createOverlay(title, initialLanguage) {
                const overlay = document.createElement("div");
                overlay.className = "editor-overlay";
                // El título es el NOMBRE del átomo, que va a innerHTML. Un átomo
                // llamado "<img onerror=...>" (p. ej. de un programa compartido)
                // inyectaría HTML aquí; se escapa. Lo demás de la plantilla son
                // constantes estáticas.
                const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
                overlay.innerHTML = `
        <div class="editor-modal">
            <div class="editor-header">
                <div class="editor-title">
                    <div class="language-selector">
                        <button class="language-button" type="button" title="Seleccionar lenguaje">
                            <i class="${initialLanguage.icon}"></i>
                            <span class="language-name">${initialLanguage.name}</span>
                        </button>
                        <div class="language-dropdown">
                            ${LANGUAGE_OPTIONS.map((language) => `
                                <button class="dropdown-item" data-lang="${language.id}">
                                    <i class="${language.icon}"></i>
                                    <span>${language.name}</span>
                                </button>
                            `).join("")}
                        </div>
                    </div>
                    <span class="modal-title">${esc(title)}</span>
                </div>
                <div class="editor-controls">
                    <button class="ai-button" title="Asistente IA (Ctrl+I)">
                        <i class="fas fa-wand-magic-sparkles"></i>
                    </button>
                    <button class="save-button" title="Guardar (Ctrl+S)">
                        <i class="fas fa-save"></i>
                    </button>
                    <button class="close-button" title="Cerrar">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            </div>
            <div class="monaco-container" style="width:100%;height:100%;"></div>
        </div>
    `;
                return overlay;
            }

            getOverlayElements(overlay) {
                return {
                    container: overlay.querySelector(".monaco-container"),
                    languageSelector: overlay.querySelector(".language-selector"),
                    languageButton: overlay.querySelector(".language-button"),
                    languageIcon: overlay.querySelector(".language-button i"),
                    languageName: overlay.querySelector(".language-name"),
                    dropdown: overlay.querySelector(".language-dropdown"),
                    dropdownItems: overlay.querySelectorAll(".dropdown-item"),
                    saveButton: overlay.querySelector(".save-button"),
                    closeButton: overlay.querySelector(".close-button"),
                    aiButton: overlay.querySelector(".ai-button"),
                };
            }

            updateLanguageButton(elements, language) {
                elements.languageIcon.className = language.icon;
                elements.languageName.textContent = language.name;
            }

            createEditor(container, code, language) {
                this.ensureTheme();

                return monaco.editor.create(container, {
                    value: code,
                    language: this.getMonacoLanguage(language),
                    theme: MONACO_THEME_NAME,
                    automaticLayout: true,
                    fontSize: 14,
                    fontFamily: "Fira Code, Consolas, monospace",
                    scrollBeyondLastLine: false,
                    minimap: { enabled: false },
                    lineNumbers: "on",
                    roundedSelection: false,
                    scrollbars: {
                        vertical: "auto",
                        horizontal: "auto",
                    },
                });
            }

            stripCodeFences(text) {
                const trimmed = String(text).trim();
                const match = trimmed.match(/^```[a-zA-Z0-9]*\s*\n([\s\S]*?)\n```$/);
                return match ? match[1] : trimmed;
            }

            askInstruction(anchor) {
                return new Promise((resolve) => {
                    const wrap = document.createElement("div");
                    wrap.className = "ai-prompt";
                    wrap.innerHTML = `
                        <input type="text" class="ai-prompt-input" placeholder="¿Qué quieres que haga la IA con este átomo?" spellcheck="false" />
                        <button class="ai-prompt-send" type="button" title="Enviar (Enter)"><i class="fas fa-arrow-up"></i></button>
                    `;
                    anchor.appendChild(wrap);

                    const input = wrap.querySelector(".ai-prompt-input");
                    const send = wrap.querySelector(".ai-prompt-send");
                    const finish = (value) => { wrap.remove(); resolve(value); };

                    input.addEventListener("keydown", (event) => {
                        event.stopPropagation();
                        if (event.key === "Enter") finish(input.value.trim() || null);
                        else if (event.key === "Escape") finish(null);
                    });
                    send.addEventListener("click", () => finish(input.value.trim() || null));
                    input.focus();
                });
            }

            async aiAssist(editor, elements, language) {
                if (this.aiBusy) return;

                const instruction = await this.askInstruction(elements.container.parentElement);
                if (!instruction) { editor.focus(); return; }

                this.aiBusy = true;
                const icon = elements.aiButton.querySelector("i");
                const previousIcon = icon.className;
                icon.className = "fas fa-spinner fa-spin";
                elements.aiButton.disabled = true;

                try {
                    // El system opcional viene del átomo "ai system §"; el resto
                    // (destino, key, estructura del prompt) lo pone Go en AIEditAtom.
                    const system = (typeof diarsaba !== "undefined" && diarsaba.get && typeof diarsaba.get("ai system §") === "string")
                        ? diarsaba.get("ai system §") : "";
                    const raw = await window.AIEditAtom(editor.getValue(), language, instruction, system);
                    const result = this.stripCodeFences(raw);

                    const selection = editor.getSelection();
                    if (selection && !selection.isEmpty()) {
                        editor.executeEdits("ai-assist", [
                            { range: selection, text: result, forceMoveMarkers: true },
                        ]);
                    } else {
                        editor.setValue(result);
                    }
                } catch (error) {
                    console.error("AIEditAtom error", error);
                    const message = (error && error.message) ? error.message : String(error);
                    if (message.includes("API key") && typeof window.openAIConfig === "function") {
                        await window.openAIConfig();
                    } else {
                        alert("Error de IA: " + message);
                    }
                } finally {
                    icon.className = previousIcon;
                    elements.aiButton.disabled = false;
                    this.aiBusy = false;
                    editor.focus();
                }
            }

            async open(title = "Editor de Código", code = "", language = "javascript") {
                await this.loadMonaco();

                return new Promise((resolve) => {
                    const initialLanguage = this.getLanguageOption(language);
                    const overlay = this.createOverlay(title, initialLanguage);
                    document.body.appendChild(overlay);

                    const elements = this.getOverlayElements(overlay);
                    const editor = this.createEditor(elements.container, code, initialLanguage.id);
                    const cleanupCallbacks = [];
                    let currentLanguage = initialLanguage.id;

                    const registerListener = (target, eventName, handler) => {
                        target.addEventListener(eventName, handler);
                        cleanupCallbacks.push(() => target.removeEventListener(eventName, handler));
                    };

                    const hideDropdown = () => {
                        elements.dropdown.classList.remove("show");
                    };

                    const closeEditor = (result) => {
                        cleanupCallbacks.forEach((cleanup) => cleanup());
                        editor.dispose();
                        overlay.remove();
                        resolve(result);
                    };

                    const changeLanguage = (nextLanguageId) => {
                        const nextLanguage = this.getLanguageOption(nextLanguageId);

                        if (!nextLanguage || currentLanguage === nextLanguage.id) {
                            return;
                        }

                        this.updateLanguageButton(elements, nextLanguage);
                        monaco.editor.setModelLanguage(editor.getModel(), this.getMonacoLanguage(nextLanguage.id));
                        currentLanguage = nextLanguage.id;
                        hideDropdown();
                    };

                    // Cancelar resuelve null; guardar resuelve el texto. Antes
                    // cancelar devolvía "", que es indistinguible de "el usuario
                    // vació el contenido": los editores de lista lo leían como
                    // vaciar y cerrar con Escape borraba la lista entera.
                    registerListener(elements.saveButton, "click", () => closeEditor(editor.getValue()));
                    registerListener(elements.closeButton, "click", () => closeEditor(null));
                    registerListener(elements.aiButton, "click", () => {
                        this.aiAssist(editor, elements, currentLanguage);
                    });
                    registerListener(elements.languageButton, "click", (event) => {
                        event.stopPropagation();
                        elements.dropdown.classList.toggle("show");
                    });
                    elements.dropdownItems.forEach((item) => {
                        registerListener(item, "click", (event) => {
                            event.stopPropagation();
                            changeLanguage(item.dataset.lang);
                        });
                    });
                    registerListener(document, "click", (event) => {
                        if (!elements.languageSelector.contains(event.target)) {
                            hideDropdown();
                        }
                    });
                    registerListener(document, "keydown", (event) => {
                        if (event.key === "Escape" && elements.dropdown.classList.contains("show")) {
                            hideDropdown();
                        }
                    });
                    registerListener(overlay, "click", (event) => {
                        if (event.target === overlay) {
                            closeEditor(null);
                        }
                    });

                    editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.KeyS, () => {
                        closeEditor(editor.getValue());
                    });
                    editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.KeyI, () => {
                        this.aiAssist(editor, elements, currentLanguage);
                    });
                    editor.addCommand(monaco.KeyCode.Escape, () => {
                        if (elements.dropdown.classList.contains("show")) {
                            hideDropdown();
                            return;
                        }

                        closeEditor(null);
                    });

                    editor.focus();
                });
            }

            // Diff de solo lectura para el historial: izquierda = versión
            // elegida, derecha = valor actual. Resuelve true si se pulsa
            // "restaurar", false al cerrar. Monta su propio overlay (no reusa
            // open, que es un editor normal con selector de lenguaje y guardado).
            async openDiff(title = "Diff", original = "", modified = "", language = "javascript") {
                await this.loadMonaco();
                this.ensureTheme();

                return new Promise((resolve) => {
                    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
                    const overlay = document.createElement("div");
                    overlay.className = "editor-overlay";
                    overlay.innerHTML = `
                        <div class="editor-modal">
                            <div class="editor-header">
                                <div class="editor-title">
                                    <span class="modal-title">${esc(title)}</span>
                                    <span class="diff-hint">izquierda: versión · derecha: actual</span>
                                </div>
                                <div class="editor-controls">
                                    <button class="restore-button" title="Restaurar esta versión">
                                        <i class="fas fa-clock-rotate-left"></i> Restaurar
                                    </button>
                                    <button class="close-button" title="Cerrar">
                                        <i class="fas fa-times"></i>
                                    </button>
                                </div>
                            </div>
                            <div class="monaco-container" style="width:100%;height:100%;"></div>
                        </div>
                    `;
                    document.body.appendChild(overlay);

                    const lang = this.getMonacoLanguage(language);
                    const originalModel = monaco.editor.createModel(original, lang);
                    const modifiedModel = monaco.editor.createModel(modified, lang);
                    const diff = monaco.editor.createDiffEditor(overlay.querySelector(".monaco-container"), {
                        theme: MONACO_THEME_NAME,
                        readOnly: true,
                        automaticLayout: true,
                        fontSize: 14,
                        fontFamily: "Fira Code, Consolas, monospace",
                        minimap: { enabled: false },
                        renderSideBySide: true,
                        scrollBeyondLastLine: false,
                    });
                    diff.setModel({ original: originalModel, modified: modifiedModel });

                    const cerrar = (result) => {
                        diff.dispose();
                        originalModel.dispose();
                        modifiedModel.dispose();
                        overlay.remove();
                        resolve(result);
                    };

                    overlay.querySelector(".restore-button").addEventListener("click", () => cerrar(true));
                    overlay.querySelector(".close-button").addEventListener("click", () => cerrar(false));
                    overlay.addEventListener("click", (e) => { if (e.target === overlay) cerrar(false); });
                });
            }
        }

        window.codeEditor = new CodeEditor();

        // --- EL BORDE (host) — ver frontend/CONTENEDOR.md ---
        // Fachada del shell que los átomos llaman en vez de tocar el DOM/Go
        // directo. HOY es MISMA-HEBRA: cada verbo reenvía al código actual, así
        // que el comportamiento no cambia. Cuando cada universo sea un worker,
        // estas mismas llamadas se volverán postMessage al shell y los átomos
        // NO cambiarán. Este primer corte cubre los canales de REENVÍO PURO —
        // UI (aviso), EDITOR y BROKER (Go). Los canales de ESCENA y WIDGETS
        // (menús, listas, modales, panel), que no son un simple forward, se
        // construyen en pasadas siguientes.
        //
        // OJO: la recuperación por consola sigue siendo con las bindings CRUDAS
        // (window.AtomHistory / window.RestoreAtomVersion), no con host: el host
        // es del shell y, con workers, no vivirá en la consola de la ventana.
        window.host = {
            // UI del host
            notify(msg) { return alert(msg); },
            async confirm(msg) { return window.confirm(msg); },

            // Editor (Monaco vive en el shell)
            async editor(nombre, src = "", lang = "javascript") {
                return window.codeEditor.open(nombre, src, lang);
            },
            async diff(titulo, versionSrc, actualSrc, lang = "javascript") {
                return window.codeEditor.openDiff(titulo, versionSrc, actualSrc, lang);
            },

            // Broker hacia Go: store de átomos (KV), persistencia, IA, red
            kv: {
                async set(nombre, valueJSON) { return window.SetAtom(nombre, valueJSON); },
                async del(nombre) { return window.DeleteAtom(nombre); },
                async history(nombre) { return window.AtomHistory(nombre); },
                async restore(nombre, seq) { return window.RestoreAtomVersion(nombre, seq); },
            },
            async save(json) { return window.SavePredefinedFunctions(json); },
            async export() { return window.ExportAtoms(); },
            async load() { return window.LoadPredefinedFunctions(); },
            async ai(code, lang, instruction, system) { return window.AIEditAtom(code, lang, instruction, system); },
            events(nombre, cb) { return window.EventsOn(nombre, cb); },
            get p2p() { return window.p2p; },
            reload() { return window.location.reload(); },

            // --- WIDGETS (el shell dibuja; el layout es suyo) ---
            // Por ahora RENDERIZAN y devuelven el elemento (o, el modal, una
            // promesa del texto). El clic sobre los ítems de menú/lista lo sigue
            // despachando "handle click ƒ" leyendo este DOM; convertir eso a
            // request/reply (host.menu → elección) es la pasada que desacopla
            // de verdad para el worker.
            _px: 20, _py: 20,
            _clamp(el) {
                // Reposiciona para que no se salga de la ventana. Mide en (0,0):
                // el ancho shrink-to-fit se comprimiría si se coloca desbordando.
                const margin = 8, vw = window.innerWidth, vh = window.innerHeight;
                const dl = parseFloat(el.style.left) || 0, dt = parseFloat(el.style.top) || 0;
                el.style.left = "0px"; el.style.top = "0px";
                const w = el.offsetWidth, h = el.offsetHeight;
                let left = dl, top = dt;
                if (left + w > vw - margin) left = vw - margin - w;
                if (top + h > vh - margin) top = vh - margin - h;
                if (left < margin) left = margin;
                if (top < margin) top = margin;
                el.style.left = `${left}px`; el.style.top = `${top}px`;
            },
            _render(v) {
                // No-string → JSON (para el payload de un peer, p.ej.); escapa &<>
                // para que un dato ajeno no inyecte HTML en el menú.
                const t = typeof v === "string" ? v : (() => { try { return JSON.stringify(v); } catch (_) { return String(v); } })();
                return t.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
            },
            // Cablea el CLIC de un menú/lista: al pulsar un ítem (botón primario)
            // llama onPick con DATOS semánticos —no el DOM— para que el universo
            // despache sin tocar la vista. stopPropagation corta el manejador
            // global (handle click ƒ) para que no lo procese dos veces. En el
            // worker, onPick se volverá un postMessage; el payload ya es data.
            _wirePick(div, onPick) {
                div.addEventListener("pointerup", (e) => {
                    if (e.button !== 0) return; // el clic derecho abre menú, no elige
                    const item = e.target.closest && e.target.closest(".menu-item");
                    if (!item || !div.contains(item)) return;
                    e.stopPropagation();
                    const r = item.getBoundingClientRect();
                    onPick({
                        label: item.textContent,
                        index: Number(item.dataset.idx),
                        parent: div.dataset.parent || "",
                        current: div.dataset.current || "",
                        rect: { left: r.left, top: r.top, right: r.right, bottom: r.bottom, width: r.width, height: r.height },
                    });
                });
            },
            // Menú de opciones (ítems sin prefijo). x/y null → junto al puntero.
            menu(list, parent = "", current = "", x = null, y = null, onPick = null) {
                const div = document.createElement("div");
                div.className = "context-menu";
                let i = 0;
                for (const key of list) div.innerHTML += `<span class="menu-item" data-idx="${i++}">${this._render(key)}</span>`;
                div.style.left = `${x === null ? this._px : x}px`;
                div.style.top = `${y === null ? this._py : y}px`;
                div.dataset.parent = parent;
                div.dataset.current = current;
                document.body.appendChild(div);
                this._clamp(div);
                if (onPick) this._wirePick(div, onPick);
                return div;
            },
            // Lista con ítems "[n] valor" (la abren · # abrir, padres, referencias…).
            list(x, y, list, parent, onPick = null) {
                const div = document.createElement("div");
                div.className = "context-menu";
                if (list.length == 0) div.innerHTML += `<span class="menu-item" data-idx="0">[0]</span>`;
                else { let i = 0; for (const key in list) div.innerHTML += `<span class="menu-item" data-idx="${i++}">[${key}] ${this._render(list[key])}</span>`; }
                div.style.left = `${x}px`;
                div.style.top = `${y}px`;
                div.dataset.parent = parent;
                document.body.appendChild(div);
                this._clamp(div);
                if (onPick) this._wirePick(div, onPick);
                return div;
            },
            // Pide un nombre. Resuelve el texto (Continue) o null (Cancel).
            async modal(pre = "") {
                return new Promise((resolve) => {
                    const div = document.createElement("div");
                    div.className = "modal-content";
                    const input = document.createElement("input");
                    input.type = "text"; input.value = pre || ""; input.spellcheck = false;
                    const bc = document.createElement("div");
                    bc.className = "modal-buttons";
                    ["Cancel", "Continue"].forEach((text) => {
                        const btn = document.createElement("button");
                        btn.textContent = text;
                        btn.dataset.modal = text.toLowerCase();
                        btn.onclick = () => { div.remove(); resolve(text === "Cancel" ? null : input.value.trim()); };
                        bc.append(btn);
                    });
                    div.append(input, bc);
                    document.body.append(div);
                    input.focus();
                });
            },
            // Panel de solo lectura junto al puntero (la bitácora). Uno a la vez.
            panel(lines) {
                document.querySelectorAll(".bitacora-panel").forEach((e) => e.remove());
                const div = document.createElement("div");
                div.className = "bitacora-panel";
                div.innerHTML = ((lines && lines.length) ? lines : ["(sin ejecuciones aún)"])
                    .map((l) => `<div class="bitacora-linea">${this._render(l)}</div>`).join("");
                div.style.left = `${this._px}px`;
                div.style.top = `${this._py}px`;
                document.body.appendChild(div);
                this._clamp(div);
                return div;
            },
            // Caja en pantalla de un chip, para anclar widgets. Hoy (misma-hebra)
            // lee la ref del chip del Map; cuando la escena viva en el shell,
            // leerá su propio registro. Fallback al puntero si no está visible.
            anchorRect(name) {
                const chip = window.host.scene.ref(name);
                if (chip instanceof Element) {
                    const r = chip.getBoundingClientRect();
                    return { left: r.left, top: r.top, right: r.right, bottom: r.bottom, width: r.width, height: r.height };
                }
                return { left: this._px, top: this._py, right: this._px, bottom: this._py, width: 0, height: 0 };
            },
            // Canal de EVENTOS: clasifica un evento de puntero en un payload
            // SEMÁNTICO — lo que antes cada átomo sacaba de event.target. El shell
            // mira el DOM UNA vez y entrega DATOS (tipo de blanco, nombre, átomo
            // dueño, coords de mundo); los átomos (handle click / show context
            // menu / on double tap / show options list) ya no tocan el evento. En
            // el worker esto se calcula aquí y viaja por postMessage.
            hit(e) {
                const t = e && e.target;
                const world = window.host.scene.worldPoint(e.clientX, e.clientY);
                const p = {
                    button: e.button ?? 0,
                    clientX: e.clientX, clientY: e.clientY,
                    world: world ? { x: world.x, y: world.y } : null,
                    kind: "other", name: "", type: "", parent: "", pano: null,
                };
                if (t && t.closest) {
                    if (t.closest(".editor-overlay, .modal-content")) { p.kind = "modal"; return p; }
                    const item = t.closest(".menu-item");
                    if (item) {
                        const cm = t.closest(".context-menu");
                        p.kind = "menu";
                        p.name = item.textContent;
                        p.type = item.textContent.slice(-1);
                        p.parent = (cm && cm.dataset.parent) || "";
                        return p;
                    }
                    if (t.closest(".context-menu")) { p.kind = "menu"; return p; }
                    const chip = t.closest(".object-name");
                    if (chip) {
                        p.kind = "chip";
                        p.name = chip.textContent;
                        p.type = chip.textContent.slice(-1);
                        p.parent = chip.dataset.parent || "";
                        p.pano = chip.dataset.pano || null;
                        return p;
                    }
                }
                if (window.host.scene.isBackground(t)) p.kind = "background";
                return p;
            },
            // El menú de fondo (main) y el de opciones de chip (chip) los rastrea
            // el SHELL (antes vivían en el Map como "current menu"/"current chip
            // menu", refs DOM). set* cierra el anterior de su ranura; clearMenus
            // barre todo lo transitorio (es el cuerpo de "clear menus ƒ", ahora
            // shim). Con alsoModals (cambio de place) barre además todo menú/modal.
            _menuMain: null,
            _menuChip: null,
            setMenu(el) {
                if (this._menuMain && typeof this._menuMain.remove === "function") this._menuMain.remove();
                this._menuMain = el instanceof Element ? el : null;
            },
            setChipMenu(el) {
                if (this._menuChip && typeof this._menuChip.remove === "function") this._menuChip.remove();
                this._menuChip = el instanceof Element ? el : null;
            },
            clearMenus(alsoModals) {
                if (this._menuMain && typeof this._menuMain.remove === "function") this._menuMain.remove();
                if (this._menuChip && typeof this._menuChip.remove === "function") this._menuChip.remove();
                this._menuMain = this._menuChip = null;
                document.querySelectorAll(".context-menu.submenu, .bitacora-panel, .historial-panel").forEach((el) => el.remove());
                if (alsoModals) document.querySelectorAll(".context-menu, .modal-content").forEach((el) => el.remove());
            },
            // Panel de ítems CLICABLES junto a un ancla (el historial). onPick
            // recibe {index, label}. Uno a la vez.
            picker(items, { anchor = null, onPick = null } = {}) {
                document.querySelectorAll(".historial-panel").forEach((e) => e.remove());
                const div = document.createElement("div");
                div.className = "historial-panel";
                items.forEach((label, i) => {
                    const it = document.createElement("div");
                    it.className = "historial-item";
                    it.textContent = label;
                    it.addEventListener("mousedown", (e) => {
                        e.preventDefault();
                        div.remove();
                        if (onPick) onPick({ index: i, label });
                    });
                    div.appendChild(it);
                });
                const rect = (anchor && anchor.chip) ? this.anchorRect(anchor.chip)
                    : { left: this._px, top: this._py, width: 0 };
                div.style.left = `${rect.left + (rect.width || 0) + 10}px`;
                div.style.top = `${rect.top}px`;
                document.body.appendChild(div);
                this._clamp(div);
                return div;
            },
            // Paleta de búsqueda (el buscador). El universo provee la LÓGICA:
            // onQuery(texto) → lista de resultados, onPick(item) al elegir. El
            // overlay, el teclado y el resaltado los lleva el shell.
            _paletteOpen: null,
            palette({ onQuery, onPick }) {
                if (this._paletteOpen) return;
                const overlay = document.createElement("div");
                overlay.className = "modal-content buscador";
                overlay.innerHTML = `
                    <input class="buscador-input" type="text" spellcheck="false" placeholder="Buscar átomo… (nombre o contenido)" />
                    <div class="buscador-resultados"></div>
                `;
                document.body.appendChild(overlay);
                this._paletteOpen = overlay;
                const input = overlay.querySelector(".buscador-input");
                const cont = overlay.querySelector(".buscador-resultados");
                let items = [];
                let sel = 0;
                const pintar = () => {
                    cont.replaceChildren();
                    items.forEach((k, i) => {
                        const el = document.createElement("div");
                        el.className = "buscador-item" + (i === sel ? " sel" : "");
                        el.textContent = k;
                        el.addEventListener("mousedown", (ev) => { ev.preventDefault(); elegir(k); });
                        cont.appendChild(el);
                    });
                };
                const cerrar = () => { overlay.remove(); this._paletteOpen = null; };
                const elegir = (k) => { cerrar(); onPick(k); };
                input.addEventListener("input", () => { items = onQuery(input.value) || []; sel = 0; pintar(); });
                input.addEventListener("keydown", (e) => {
                    e.stopPropagation();
                    if (e.key === "Escape") cerrar();
                    else if (e.key === "Enter") { if (items[sel]) elegir(items[sel]); }
                    else if (e.key === "ArrowDown") { sel = Math.min(sel + 1, items.length - 1); pintar(); e.preventDefault(); }
                    else if (e.key === "ArrowUp") { sel = Math.max(sel - 1, 0); pintar(); e.preventDefault(); }
                });
                input.focus();
            },

            // --- ESCENA: el REGISTRO de refs DOM de los chips + operaciones ---
            // El registro "nombre → elemento" vive AQUÍ (antes en el Map como
            // claves "${name} ֎"). host.scene es su dueño: la creación de chips
            // lo llena vía register, y todo lo que ancla/quita/renombra/parpadea
            // lo consulta. Cuando los átomos corran en un worker no podrán tener
            // refs DOM — ya no las tienen: hablan con estos verbos y el Map deja
            // de acumular claves "֎" de chips (solo quedan las de INFRAESTRUCTURA
            // viva: "3d … ֎", "grafo … ֎", etc.). Tres familias, como las claves
            // derivadas de antes: chip ("֎"), hijo abierto ("֎ ֎") y lista
            // abierta ("# ֎"); los submenús ("submenu ֎") aparte.
            scene: {
                _chips: new Map(),
                _child: new Map(),
                _list: new Map(),
                _submenu: new Map(),
                // La creación registra aquí (antes: diarsaba.set("${name} ֎")).
                register(name, div) { if (div instanceof Element) this._chips.set(name, div); },
                ref(name) { return this._chips.get(name); },
                // Abre el hijo/lista/submenú de un nombre, cerrando el anterior
                // (colapsa el patrón "si hay previo, .remove(); luego set").
                openChild(name, div) {
                    const prev = this._child.get(name);
                    if (prev && typeof prev.remove === "function") prev.remove();
                    this._child.set(name, div);
                },
                child(name) { return this._child.get(name); },
                // Edición inline del hijo abierto ("֎ ֎"): · ֎ editar lo vuelve
                // editable; · ֎x guardar lo cierra y DEVUELVE su texto (el átomo
                // lo parsea por tipo: Number, createFunction, o tal cual). Así el
                // átomo no toca el DOM — el shell lee el textContent.
                editChild(name) {
                    const el = this._child.get(name);
                    if (!(el instanceof Element)) return;
                    el.contentEditable = true;
                    el.focus();
                },
                commitChild(name) {
                    const el = this._child.get(name);
                    if (!(el instanceof Element)) return "";
                    el.contentEditable = false;
                    return el.textContent;
                },
                openList(name, el) {
                    const prev = this._list.get(name);
                    if (prev && typeof prev.remove === "function") prev.remove();
                    this._list.set(name, el);
                },
                listRef(name) { return this._list.get(name); },
                openSubmenu(name, el) {
                    const prev = this._submenu.get(name);
                    if (prev && typeof prev.remove === "function") prev.remove();
                    // La marca "submenu" permite a host.clearMenus barrerlos todos
                    // por clase sin llevar la cuenta (se abren en cadena).
                    if (el instanceof Element) el.classList.add("submenu");
                    this._submenu.set(name, el);
                },
                // Marca un chip DESECHABLE de la panorámica: dataset.pano (a qué
                // place vuela un clic; lo lee host.hit) y, si es la etiqueta del
                // cluster, la clase "pano-label". El átomo (panorámica pintar ƒ)
                // ya no toca el elemento devuelto por make.
                tagPano(chip, place, isLabel) {
                    if (!(chip instanceof Element)) return;
                    chip.dataset.pano = place;
                    if (isLabel) chip.classList.add("pano-label");
                },
                // Olvida las refs de chips/hijos/listas (cambio de place /
                // panorámica). Antes lo hacía un barrido de claves "֎" del Map.
                // Los submenús son overlays de menú: los cierra "clear menus ƒ".
                forgetChips() { this._chips.clear(); this._child.clear(); this._list.clear(); },
                // Quita el chip principal; si no está, su hijo abierto.
                remove(name) {
                    const chip = this._chips.get(name);
                    if (chip && typeof chip.remove === "function") { chip.remove(); this._chips.delete(name); return; }
                    const child = this._child.get(name);
                    if (child && typeof child.remove === "function") child.remove();
                    this._child.delete(name);
                },
                // Quita solo el hijo abierto.
                removeChild(name) {
                    const el = this._child.get(name);
                    if (el && typeof el.remove === "function") el.remove();
                    this._child.delete(name);
                },
                // Quita solo la lista abierta.
                removeList(name) {
                    const el = this._list.get(name);
                    if (el instanceof Element) el.remove();
                    this._list.delete(name);
                },
                // Quita chip + hijo + lista (quitar/eliminar).
                removeAll(name) {
                    for (const reg of [this._chips, this._child, this._list]) {
                        const el = reg.get(name);
                        if (el && typeof el.remove === "function") el.remove();
                        reg.delete(name);
                    }
                },
                // Parpadea el chip con una clase durante ms (resaltar/bitácora).
                // Clase, no left/top: el proyector pisa lo inline pero no las clases.
                flash(name, kind, ms = 700) {
                    const chip = this._chips.get(name);
                    if (!(chip instanceof Element)) return;
                    chip.classList.add(kind);
                    setTimeout(() => chip.classList.remove(kind), ms);
                },
                // Renombra el chip visible: texto + tipo, reapunta la ref y tira
                // las derivadas (se regeneran al reabrirse).
                rename(viejo, nuevo) {
                    const chip = this._chips.get(viejo);
                    if (chip instanceof Element) {
                        chip.textContent = nuevo;
                        chip.dataset.type = nuevo.slice(-1);
                        this._chips.set(nuevo, chip);
                    }
                    this._chips.delete(viejo);
                    this._child.delete(viejo);
                    this._list.delete(viejo);
                },
                // Materializa el chip de `name` pegado a la IZQUIERDA de su hijo
                // ("child") o lista ("list") abierta, corrido medio ancho para
                // quedar a ras. Toda la geometría —medir la caja del ancla,
                // proyectar a mundo, colocar y medir el chip nuevo— es del shell;
                // el átomo (· ֎* padre / · #* padre) solo dice el nombre y el ancla.
                spawnChipLeftOf(name, anchorKind) {
                    const anchor = (anchorKind === "list" ? this._list : this._child).get(name);
                    if (!(anchor instanceof Element)) return;
                    const rect = anchor.getBoundingClientRect();
                    const sx = rect.left - 10;
                    const sy = rect.top + rect.height / 2;
                    const mundo = this.worldPoint(sx, sy);
                    const chip = this.make(mundo ? mundo.x : sx, mundo ? -mundo.y : sy, name, "", name.slice(0, 1));
                    if (chip._obj3d) {
                        chip._obj3d.position.x -= chip.offsetWidth / 2;
                        this.render();
                    } else {
                        chip.style.left = `${sx - chip.offsetWidth - 10}px`;
                    }
                    this.register(name, chip);
                },

                // --- El MOTOR 3d (antes átomos "3d …ƒ" / create chip / mover) ---
                // Cuerpos idénticos a los átomos originales; estos siguen existiendo
                // como shims que delegan aquí. El estado (escena/cámara/mira) sigue
                // en refs "3d … ֎" del Map por ahora (misma-hebra). Ver CONTENEDOR.md.
                init() {
                    if (diarsaba.get("3d escena ֎")) return;
                    if (!window.THREE) { console.warn("[3d] window.THREE no está: los chips caen al body plano."); return; }
                    const THREE = window.THREE;
                    const escena = new THREE.Scene();
                    // "|| 1": si la app arranca OCULTA (bandeja), innerWidth/Height
                    // son 0 y el aspecto saldría NaN, envenenando toda la matriz de
                    // proyección (unproject → NaN, se cae el pan y el arrastre). El
                    // resize lo corrige al mostrarse; esto evita el estado roto.
                    const camara = new THREE.PerspectiveCamera(45, (window.innerWidth / window.innerHeight) || 1, 1, 200000);
                    const contenedor = document.createElement("div");
                    contenedor.classList.add("escena-3d");
                    document.body.appendChild(contenedor);
                    diarsaba.set("3d escena ֎", escena);
                    diarsaba.set("3d camara ֎", camara);
                    diarsaba.set("3d contenedor ֎", contenedor);
                    window.addEventListener("resize", () => {
                        camara.aspect = window.innerWidth / window.innerHeight;
                        camara.updateProjectionMatrix();
                        window.host.scene.render();
                    });
                    window.host.scene.reset();
                    window.host.scene.controls();
                },
                project() {
                    const camara = diarsaba.get("3d camara ֎");
                    const escena = diarsaba.get("3d escena ֎");
                    if (!camara || !escena) return;
                    camara.updateMatrixWorld();
                    const w = window.innerWidth;
                    const h = window.innerHeight;
                    const d0 = (h / 2) / Math.tan((camara.fov * Math.PI) / 360);
                    const visibles = [];
                    const ocultos = [];
                    for (const obj of escena.children) {
                        const el = obj.element;
                        if (!(el instanceof Element)) continue;
                        const vista = obj.position.clone().applyMatrix4(camara.matrixWorldInverse);
                        if (vista.z >= -1) { ocultos.push(el); continue; }
                        const s = Math.min(Math.round((d0 / -vista.z) * 1000) / 1000, 50);
                        const p = obj.position.clone().project(camara);
                        visibles.push({
                            el,
                            x: ((p.x + 1) / 2) * w,
                            y: ((1 - p.y) / 2) * h,
                            s,
                            prof: -vista.z,
                            mw: el.offsetWidth / 2,
                            mh: el.offsetHeight / 2,
                        });
                    }
                    for (const el of ocultos) el.style.visibility = "hidden";
                    visibles.sort((a, b) => b.prof - a.prof);
                    let z = 0;
                    for (const c of visibles) {
                        c.el.style.visibility = "";
                        c.el.style.fontSize = c.s === 1 ? "" : `${c.s}rem`;
                        c.el.style.left = `${Math.round(c.x - c.mw)}px`;
                        c.el.style.top = `${Math.round(c.y - c.mh)}px`;
                        c.el.style.zIndex = String(++z);
                    }
                    window.host.grafo.draw();
                },
                render() {
                    if (diarsaba.get("3d render pendiente ֎")) return;
                    if (!diarsaba.get("3d camara ֎")) return;
                    diarsaba.set("3d render pendiente ֎", true);
                    requestAnimationFrame(() => {
                        diarsaba.set("3d render pendiente ֎", false);
                        window.host.scene.project();
                    });
                },
                reset() {
                    const THREE = window.THREE;
                    const camara = diarsaba.get("3d camara ֎");
                    if (!THREE || !camara) return;
                    const cx = window.innerWidth / 2;
                    const cy = window.innerHeight / 2;
                    const d = cy / Math.tan((camara.fov * Math.PI) / 360);
                    camara.position.set(cx, -cy, d);
                    camara.up.set(0, 1, 0);
                    camara.lookAt(cx, -cy, 0);
                    const mira = diarsaba.get("3d mira ֎");
                    if (mira) mira.set(cx, -cy, 0);
                    else diarsaba.set("3d mira ֎", new THREE.Vector3(cx, -cy, 0));
                    window.host.scene.render();
                },
                // PANORÁMICA — cámara (antes en los átomos, que usaban THREE y la
                // cámara directo). El átomo da la GEOMETRÍA (centros + caja); el
                // shell encuadra y vuela. Los centros se guardan aquí para el vuelo.
                _panoCenters: {},
                frameClusters(centers, minX, maxX, minY, maxY) {
                    this._panoCenters = centers || {};
                    const THREE = window.THREE;
                    const camara = diarsaba.get("3d camara ֎");
                    if (THREE && camara && isFinite(minX)) {
                        const bcx = (minX + maxX) / 2, bcy = (minY + maxY) / 2;
                        const bw = (maxX - minX) + 500, bh = (maxY - minY) + 500;
                        const fov = (camara.fov * Math.PI) / 180;
                        const distH = (bh / 2) / Math.tan(fov / 2);
                        const distW = (bw / 2) / (Math.tan(fov / 2) * camara.aspect);
                        const dist = Math.max(distH, distW) * 1.08;
                        const mira = new THREE.Vector3(bcx, -bcy, 0);
                        camara.position.set(bcx, -bcy, dist);
                        camara.up.set(0, 1, 0);
                        camara.lookAt(mira);
                        diarsaba.set("3d mira ֎", mira);
                    }
                    this.render();
                },
                flyToCluster(placeName, onArrive) {
                    const THREE = window.THREE;
                    const camara = diarsaba.get("3d camara ֎");
                    const destino = this._panoCenters && this._panoCenters[placeName];
                    if (!THREE || !camara || !destino) { onArrive(); return; }
                    const desde = camara.position.clone();
                    const miraDesde = (diarsaba.get("3d mira ֎") || new THREE.Vector3()).clone();
                    const posObj = new THREE.Vector3(destino.x, -destino.y, 640);
                    const miraObj = new THREE.Vector3(destino.x, -destino.y, 0);
                    const t0 = performance.now();
                    const dur = 380;
                    const paso = () => {
                        const t = Math.min((performance.now() - t0) / dur, 1);
                        const e = t * t * (3 - 2 * t); // smoothstep
                        camara.position.lerpVectors(desde, posObj, e);
                        const m = miraDesde.clone().lerp(miraObj, e);
                        camara.lookAt(m);
                        diarsaba.set("3d mira ֎", m);
                        this.project();
                        if (t < 1) requestAnimationFrame(paso);
                        else onArrive();
                    };
                    requestAnimationFrame(paso);
                },
                worldPoint(clientX, clientY) {
                    const THREE = window.THREE;
                    const camara = diarsaba.get("3d camara ֎");
                    if (!THREE || !camara) return null;
                    const ndc = new THREE.Vector2(
                        (clientX / window.innerWidth) * 2 - 1,
                        -(clientY / window.innerHeight) * 2 + 1
                    );
                    const ray = new THREE.Raycaster();
                    ray.setFromCamera(ndc, camara);
                    const plano = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
                    return ray.ray.intersectPlane(plano, new THREE.Vector3());
                },
                controls() {
                    if (diarsaba.get("3d controles ֎")) return;
                    diarsaba.set("3d controles ֎", true);
                    const THREE = window.THREE;
                    // Directo a host.scene (sync): estos manejadores de puntero
                    // usan preventDefault y no pueden esperar. Los shims
                    // "3d punto en plano ƒ" / "es fondo ƒ" quedan solo de cara a
                    // los ÁTOMOS, que los awaitan (serán postMessage en el worker).
                    const punto = (x, y) => window.host.scene.worldPoint(x, y);
                    const pedir = () => window.host.scene.render();
                    let modo = null;
                    let ancla = null;
                    let ultimo = null;
                    window.addEventListener("pointerdown", (e) => {
                        if (!window.host.scene.isBackground(e.target)) return;
                        if (e.button === 1 || (e.button === 0 && e.altKey)) modo = "orbita";
                        else if (e.button === 0) modo = "pan";
                        else return;
                        ancla = punto(e.clientX, e.clientY);
                        ultimo = { x: e.clientX, y: e.clientY };
                        e.preventDefault();
                    }, true);
                    window.addEventListener("pointermove", (e) => {
                        if (!modo) return;
                        const camara = diarsaba.get("3d camara ֎");
                        const mira = diarsaba.get("3d mira ֎");
                        if (!camara || !mira) return;
                        if (modo === "pan" && ancla) {
                            const ahora = punto(e.clientX, e.clientY);
                            if (!ahora) return;
                            const delta = ancla.clone().sub(ahora);
                            camara.position.add(delta);
                            mira.add(delta);
                            pedir();
                        } else if (modo === "orbita" && ultimo) {
                            const dx = e.clientX - ultimo.x;
                            const dy = e.clientY - ultimo.y;
                            ultimo = { x: e.clientX, y: e.clientY };
                            const offset = camara.position.clone().sub(mira);
                            const esf = new THREE.Spherical().setFromVector3(offset);
                            esf.theta -= dx * 0.005;
                            esf.phi -= dy * 0.005;
                            esf.phi = Math.max(0.05, Math.min(Math.PI - 0.05, esf.phi));
                            offset.setFromSpherical(esf);
                            camara.position.copy(mira).add(offset);
                            camara.lookAt(mira);
                            pedir();
                        }
                    }, true);
                    window.addEventListener("pointerup", () => { modo = null; ancla = null; ultimo = null; }, true);
                    window.addEventListener("wheel", (e) => {
                        const camara = diarsaba.get("3d camara ֎");
                        const mira = diarsaba.get("3d mira ֎");
                        if (!camara || !mira) return;
                        if (e.target.closest && e.target.closest(".context-menu, .modal-content, .editor-overlay")) return;
                        const factor = e.deltaY > 0 ? 1.1 : 1 / 1.1;
                        const foco = punto(e.clientX, e.clientY) || mira.clone();
                        camara.position.sub(foco).multiplyScalar(factor).add(foco);
                        mira.sub(foco).multiplyScalar(factor).add(foco);
                        pedir();
                        e.preventDefault();
                    }, { passive: false, capture: true });
                },
                clear() {
                    // El registro de chips se vacía siempre (antes lo barría el
                    // bucle de claves "֎" del Map en on double tap / panorámica).
                    this.forgetChips();
                    const escena = diarsaba.get("3d escena ֎");
                    if (!escena) return;
                    [...escena.children].forEach((obj) => {
                        if (obj.element instanceof Element && obj.element.parentNode) {
                            obj.element.parentNode.removeChild(obj.element);
                        }
                        escena.remove(obj);
                    });
                    window.host.scene.render();
                },
                isBackground(target) {
                    if (!target || !(target instanceof Element)) return true;
                    const n = target.nodeName;
                    if (n === "HTML" || n === "BODY") return true;
                    if (target.closest(".object-name, .context-menu, .modal-content, .editor-overlay")) return false;
                    return !!target.closest(".escena-3d");
                },
                make(x, y, text, parent = "", type = "") {
                    const div = document.createElement("div");
                    div.classList = "object-name";
                    div.textContent = text;
                    div.spellcheck = false;
                    div.dataset.parent = parent;
                    div.dataset.type = type;
                    const escena = diarsaba.get("3d escena ֎");
                    const contenedor = diarsaba.get("3d contenedor ֎");
                    if (!escena || !contenedor) {
                        div.style.left = `${x}px`;
                        div.style.top = `${y}px`;
                        document.body.appendChild(div);
                        window.host._clamp(div);
                        return div;
                    }
                    const obj = new window.THREE.Object3D();
                    obj.position.set(x, -y, 0);
                    obj.element = div;
                    escena.add(obj);
                    div._obj3d = obj;
                    contenedor.appendChild(div);
                    const removeDom = div.remove.bind(div);
                    div.remove = () => {
                        escena.remove(obj);
                        removeDom();
                        window.host.scene.render();
                    };
                    window.host.scene.render();
                    return div;
                },
                installDrag() {
                    if (diarsaba.get("mover instalado ֎")) return;
                    diarsaba.set("mover instalado ֎", true);
                    let arrastrando = null;
                    let desfase = null;
                    let dx = 0;
                    let dy = 0;
                    window.addEventListener("pointerdown", (e) => {
                        if (!diarsaba.get("moviendo chips §")) return;
                        if (e.button !== 0) return;
                        const chip = e.target.closest(".object-name");
                        if (!chip) return;
                        arrastrando = chip;
                        const obj = chip._obj3d;
                        const p = obj ? window.host.scene.worldPoint(e.clientX, e.clientY) : null;
                        if (obj && p) {
                            desfase = obj.position.clone().sub(p);
                        } else {
                            desfase = null;
                            const r = chip.getBoundingClientRect();
                            dx = e.clientX - r.left;
                            dy = e.clientY - r.top;
                        }
                        chip.setPointerCapture?.(e.pointerId);
                        chip.classList.add("arrastrando");
                        e.stopPropagation();
                        e.preventDefault();
                    }, true);
                    window.addEventListener("pointermove", (e) => {
                        if (!arrastrando) return;
                        const obj = arrastrando._obj3d;
                        if (obj && desfase) {
                            const p = window.host.scene.worldPoint(e.clientX, e.clientY);
                            if (p) { obj.position.copy(p.add(desfase)); window.host.scene.render(); }
                        } else {
                            arrastrando.style.left = `${e.clientX - dx}px`;
                            arrastrando.style.top = `${e.clientY - dy}px`;
                        }
                        e.stopPropagation();
                    }, true);
                    window.addEventListener("pointerup", (e) => {
                        if (!arrastrando) return;
                        const chip = arrastrando;
                        arrastrando = null;
                        desfase = null;
                        chip.classList.remove("arrastrando");
                        const nombre = chip.textContent;
                        const placeName = diarsaba.get("current place §");
                        const place = diarsaba.get(placeName);
                        if (place && typeof place === "object" && nombre in place) {
                            const obj = chip._obj3d;
                            const pos = obj
                                ? { x: obj.position.x, y: -obj.position.y }
                                : { x: parseFloat(chip.style.left) || 0, y: parseFloat(chip.style.top) || 0 };
                            diarsaba.set(placeName, { ...place, [nombre]: pos });
                            diarsaba.get("persistir atomo ƒ")(placeName);
                        }
                        e.stopPropagation();
                        e.preventDefault();
                    }, true);
                },
            },

            // Clase de MODO en el body (mover/grafo/panorámica anuncian su estado
            // con un borde en el lienzo). Es UI del shell, no del universo.
            mode(cls, on) { document.body.classList.toggle(cls, on); },

            // Las ARISTAS del modo grafo (canvas 2d detrás de los chips). Cuerpos
            // idénticos a los átomos "grafo init/dibujar ƒ", que ahora son shims.
            grafo: {
                init() {
                    if (diarsaba.get("grafo lienzo ֎")) return;
                    const canvas = document.createElement("canvas");
                    canvas.className = "grafo-lienzo";
                    canvas.width = window.innerWidth;
                    canvas.height = window.innerHeight;
                    document.body.insertBefore(canvas, document.body.firstChild);
                    diarsaba.set("grafo lienzo ֎", canvas);
                    window.addEventListener("resize", () => window.host.grafo.draw());
                },
                draw() {
                    const canvas = diarsaba.get("grafo lienzo ֎");
                    if (!canvas) return;
                    const ctx = canvas.getContext("2d");
                    if (canvas.width !== window.innerWidth || canvas.height !== window.innerHeight) {
                        canvas.width = window.innerWidth;
                        canvas.height = window.innerHeight;
                    }
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    if (!diarsaba.get("grafo activo §")) return;
                    const aristas = diarsaba.get("grafo aristas ֎") || [];
                    const cache = {};
                    const centro = (nombre) => {
                        if (nombre in cache) return cache[nombre];
                        let c = null;
                        const chip = window.host.scene.ref(nombre);
                        if (chip instanceof Element && chip.style.visibility !== "hidden") {
                            const r = chip.getBoundingClientRect();
                            if (r.width) c = { x: r.left + r.width / 2, y: r.top + r.height / 2 };
                        }
                        cache[nombre] = c;
                        return c;
                    };
                    ctx.lineWidth = 1;
                    ctx.strokeStyle = "rgba(255, 255, 255, 0.22)";
                    ctx.fillStyle = "rgba(255, 255, 255, 0.4)";
                    for (const [a, b] of aristas) {
                        const ca = centro(a), cb = centro(b);
                        if (!ca || !cb) continue;
                        ctx.beginPath();
                        ctx.moveTo(ca.x, ca.y);
                        ctx.lineTo(cb.x, cb.y);
                        ctx.stroke();
                        const ang = Math.atan2(cb.y - ca.y, cb.x - ca.x);
                        const px = cb.x - Math.cos(ang) * 16;
                        const py = cb.y - Math.sin(ang) * 16;
                        ctx.beginPath();
                        ctx.moveTo(px, py);
                        ctx.lineTo(px - Math.cos(ang - 0.4) * 8, py - Math.sin(ang - 0.4) * 8);
                        ctx.lineTo(px - Math.cos(ang + 0.4) * 8, py - Math.sin(ang + 0.4) * 8);
                        ctx.closePath();
                        ctx.fill();
                    }
                },
            },

            // Gestor de estilos: sincroniza los átomos "{" a etiquetas <style>.
            // Cuerpo idéntico al átomo "install style manager ƒ" (ahora shim).
            installStyles() {
                const styleIdFromKey = (k) => {
                    const base = String(k).replace(/\s*\{$/, "").trim();
                    return 'diarsaba-style-' + base.replace(/[^\w-]/g, '_').replace(/^_+|_+$/g, '');
                };
                for (const [k, v] of diarsaba.entries()) {
                    if (typeof k === 'string' && k.endsWith('{')) {
                        const id = styleIdFromKey(k);
                        if (!document.getElementById(id)) {
                            const el = document.createElement('style');
                            el.id = id;
                            el.textContent = typeof v === 'string' ? v : '';
                            document.head.appendChild(el);
                        }
                    }
                }
                const originalSet = diarsaba.set.bind(diarsaba);
                diarsaba.set = (key, value) => {
                    originalSet(key, value);
                    try {
                        if (typeof key === 'string' && key.endsWith('{')) {
                            const id = styleIdFromKey(key);
                            let el = document.getElementById(id);
                            if (el) el.textContent = typeof value === 'string' ? value : '';
                            else {
                                el = document.createElement('style');
                                el.id = id;
                                el.textContent = typeof value === 'string' ? value : '';
                                document.head.appendChild(el);
                            }
                        }
                    } catch (e) { console.error('install style manager error', e); }
                    return diarsaba;
                };
            },

            // ¿Hay backend Go detrás? (algunos átomos degradan sin él.)
            get tieneBackend() { return typeof window.go !== "undefined"; },
        };

        // El shell sigue el puntero para anclar los widgets (menús, panel) sin
        // depender del Map del universo. (Evento del shell, ver CONTENEDOR.md.)
        window.addEventListener("pointermove", (e) => {
            window.host._px = e.clientX;
            window.host._py = e.clientY;
        });

        // Abre el editor JSON con la configuración de IA (proveedor, modelo,
        // baseURL, apiKey). La key se muestra enmascarada y vive solo en el
        // backend Go, fuera del repositorio.
        // Solo lectura: la config de IA vive en Go, en un archivo que los átomos
        // no pueden reescribir (por seguridad — ver AIEditAtom / la auditoría).
        // Para cambiar proveedor/modelo/key se edita ese archivo a mano.
        window.openAIConfig = async () => {
            let info;
            try {
                const loaded = await window.GetAIConfig();
                const c = loaded && loaded.trim() ? JSON.parse(loaded) : {};
                info = "Configuración de IA (solo lectura)\n\n" +
                    `proveedor: ${c.provider || "(sin definir)"}\n` +
                    `modelo:    ${c.model || "(sin definir)"}\n` +
                    `baseURL:   ${c.baseURL || "(por defecto: openai)"}\n` +
                    `apiKey:    ${c.apiKey || "(sin configurar)"}\n\n` +
                    "Para cambiarla, edita este archivo:\n" +
                    (c.path || "ai_config.json en la carpeta de datos de diarsaba") +
                    "\n\n(Vive en Go, fuera del alcance de los átomos, por seguridad.)";
            } catch (e) {
                console.error("GetAIConfig error", e);
                info = "No se pudo leer la configuración de IA.";
            }
            alert(info);
        };

        function createFunction(functionString) {
            const n = functionString.trim(),
                t = [
                    /^async\s*\(([^)]*)\)\s*=>\s*\{([\s\S]*)\}$/,
                    /^async\s*\(([^)]*)\)\s*=>\s*([^{].*)$/,
                    /^async\s+function[^(]*\(([^)]*)\)\s*\{([\s\S]*)\}$/,
                    /^async\s+function\s*\(([^)]*)\)\s*\{([\s\S]*)\}$/,
                    /^\(([^)]*)\)\s*=>\s*\{([\s\S]*)\}$/,
                    /^\(([^)]*)\)\s*=>\s*([^{].*)$/,
                    /^function[^(]*\(([^)]*)\)\s*\{([\s\S]*)\}$/,
                    /^function\s*\(([^)]*)\)\s*\{([\s\S]*)\}$/,
                ];
            for (const s of t) {
                const t = n.match(s);
                if (t) {
                    const n = t[1]
                        .split(",")
                        .map((n) => n.trim())
                        .filter((n) => n);
                    let i = t[2];
                    const c = s.toString().includes("async");
                    // Los patrones de cuerpo conciso (flecha sin llaves) capturan el
