<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <title>DIARSABA — el paquete portable (un archivo)</title>
    <!-- GENERADO por herramientas/empaquetar.mjs — no se edita a mano.
         La fuente es index.html + src/. Esto es la versión de un archivo, para
         abrir a doble clic (sin módulos y sin fetch, funciona desde file://). -->
    <style>
/* ── CSS: solo lo que el menú necesita (copiado de "todo el estilo {") ── */
:root {
    --graph-bg: #000000;
    --graph-bg-strong: rgba(0, 0, 0, 0.92);
    --graph-border: rgba(255, 255, 255, 0.14);
    --graph-border-active: rgba(255, 255, 255, 0.24);
    --graph-text: #ffffff;
    --graph-text-muted: rgba(255, 255, 255, 0.62);
    --graph-shadow: 0 18px 48px rgba(0, 0, 0, 0.35);
    --graph-font: ui-monospace, "Cascadia Mono", Consolas, "Courier New", monospace;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: var(--graph-bg);
    min-height: 100vh;
    overflow: hidden;
    font-family: var(--graph-font);
    color: var(--graph-text);
}

/* ── EL LIENZO DE UN PLACE ("@") ──────────────────────────────────────
     Un place es un LIENZO entero: viajar a él lo borra y lo vuelve a pintar.
     Es un escenario de 200×200 unidades que se escala a la ventana, así que
     las coordenadas de la escena son % del place y los tamaños son px de ese
     escenario: la misma escena se ve igual en cualquier pantalla.
     z-index: 0 hace del lienzo un contexto de apilado propio, y por eso un
     "z" negativo (el suelo) queda detrás de lo demás pero delante del fondo,
     y nunca por encima de un menú. */
#lienzo {
    position: fixed;
    left: 50%;
    top: 50%;
    width: 200px;
    height: 200px;
    z-index: 0;
    transform: translate(-50%, -50%) scale(var(--escala, 3));
    pointer-events: none;
}

/* Un círculo: se ancla por su CENTRO, para que (x, y) sea el punto que
     dice la escena y no su esquina. */
.escena-circulo {
    position: absolute;
    border-radius: 50%;
    transform: translate(-50%, -50%);
}

/* Un trazo: su propio <svg> del tamaño del lienzo, en coordenadas 0..100
     (las mismas que la escena). "non-scaling-stroke" mantiene el grosor en px
     aunque el viewBox se estire, así una línea no engorda al escalar. */
.escena-trazo {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    overflow: visible;
}

/* Un texto de la escena. Se ancla por su izquierda y su medio vertical, así
     (x, y) es donde empieza la línea. */
.escena-texto {
    position: absolute;
    transform: translateY(-50%);
    white-space: nowrap;
    line-height: 1;
}

/* El nombre del place al que se ha viajado. */
#place-nombre {
    position: fixed;
    left: 12px;
    bottom: 10px;
    font-size: .7rem;
    color: rgba(255, 255, 255, .38);
    user-select: none;
    pointer-events: none;
}

/* El menú y la lista son EL MISMO widget: .context-menu con .menu-item.
     Lo que cambia es la SEMÁNTICA del despacho, no el dibujo. */
.context-menu {
    position: absolute;
    background: var(--graph-bg-strong);
    border-radius: 14px;
    box-shadow: var(--graph-shadow);
    border: 1px solid var(--graph-border);
    z-index: 1000;
    min-width: 140px;
    max-height: min(360px, 60vh);
    overflow-y: auto;
    overflow-x: hidden;
    user-select: none;
    backdrop-filter: blur(14px);
}

.context-menu::-webkit-scrollbar {
    width: 6px;
}

.context-menu::-webkit-scrollbar-track {
    background: transparent;
}

.context-menu::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, .14);
    border-radius: 999px;
}

.menu-item {
    padding: 6px 12px;
    font-size: .75rem;
    color: var(--graph-text-muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    user-select: none;
    border-bottom: 1px solid rgba(255, 255, 255, .08);
}

/* El nombre del átomo que el menú muestra. No es un ítem: no se pulsa, no
     cuenta para los índices. Con varios menús abiertos, es lo que distingue
     uno de otro. */
.menu-titulo {
    display: block;
    padding: 5px 12px;
    font-size: .68rem;
    color: rgba(255, 255, 255, .38);
    border-bottom: 1px solid rgba(255, 255, 255, .16);
    user-select: none;
}

.menu-item:last-child {
    border-bottom: none;
}

.menu-item:hover {
    background: rgba(255, 255, 255, .08);
}

.menu-item:active {
    background: rgba(255, 255, 255, .12);
}

/* El MODAL que pide un nombre (copiado igual de "todo el estilo {"). */
.modal-content {
    position: absolute;
    left: 50%;
    top: 50%;
    padding: 1rem;
    border: 1px solid var(--graph-border);
    border-radius: 18px;
    background: rgba(0, 0, 0, 0.88);
    box-shadow: var(--graph-shadow);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    transform: translate(-50%, -50%);
    z-index: 2000;
}

.modal-content button {
    font-size: 0.75rem;
    color: var(--graph-text);
    font-weight: 500;
    cursor: pointer;
    padding: 4px 12px;
    border-radius: 10px;
    transition: all 0.15s ease;
    width: fit-content;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid var(--graph-border);
    outline: none;
    user-select: none;
}

.modal-content button:hover {
    background: rgba(255, 255, 255, 0.12);
    border-color: var(--graph-border-active);
}

.modal-content button:active {
    background: rgba(255, 255, 255, 0.18);
    transform: scale(0.98);
}

.modal-content button[data-modal="continue"] {
    background: rgba(255, 255, 255, 0.2);
    color: var(--graph-text);
    border: 1px solid rgba(255, 255, 255, 0.38);
}

.modal-content button[data-modal="continue"]:hover {
    background: rgba(255, 255, 255, 0.3);
}

.modal-content input {
    border: 1px solid rgba(255, 255, 255, 0.1);
    outline: none;
    padding: 4px 8px;
    border-radius: 8px;
    color: var(--graph-text);
    font-family: inherit;
    font-size: 1rem;
    flex: 1;
    background: rgba(255, 255, 255, 0.06);
}

.modal-content span {
    font-family: inherit;
    color: var(--graph-text-muted);
    font-weight: 100;
    font-size: smaller;
    font-style: italic;
}

.modal-buttons {
    display: flex;
    gap: 8px;
    justify-content: space-around;
    margin-top: 12px;
}

/* El EDITOR (Monaco vive en el shell) — también copiado del estilo real. */
.editor-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.22);
    justify-content: center;
    align-items: center;
    z-index: 3000;
    backdrop-filter: blur(1px) saturate(0.6%);
    -webkit-backdrop-filter: blur(1px) saturate(0.6%);
    display: flex;
}

.editor-modal {
    width: 90%;
    max-width: 900px;
    height: 80%;
    max-height: 700px;
    border-radius: 18px;
    background: rgba(0, 0, 0, 0.34);
    box-shadow: 0 24px 64px rgba(0, 0, 0, 0.32);
    border: 1px solid var(--graph-border);
    backdrop-filter: blur(1px) saturate(0.6%);
    -webkit-backdrop-filter: blur(1px) saturate(0.6%);
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

.editor-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(255, 255, 255, 0.06);
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    padding: 12px 16px;
    flex-shrink: 0;
}

.editor-title {
    color: var(--graph-text);
    font-size: 14px;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 8px;
}

.editor-header .modal-buttons {
    margin-top: 0;
}

.monaco-container {
    flex: 1;
    width: 100%;
    height: 100%;
    background: rgba(255, 255, 255, 0.04);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
}

.monaco-container .monaco-editor,
.monaco-container .monaco-editor-background,
.monaco-container .margin,
.monaco-container .monaco-scrollable-element {
    background: transparent !important;
}

/* Respaldo si Monaco no está disponible (el demo abierto suelto). */
.monaco-container textarea {
    width: 100%;
    height: 100%;
    resize: none;
    border: none;
    outline: none;
    background: transparent;
    color: var(--graph-text);
    font-family: var(--graph-font);
    font-size: .8rem;
    padding: 12px 16px;
    line-height: 1.5;
    tab-size: 4;
}

    </style>
</head>

<body>

    <div id="lienzo"></div>
    <span id="place-nombre"></span>

    <script>
        /* ── EL UNIVERSO, incrustado ─────────────────────────────────────────
           Los mismos 104 átomos de src/atomos/*.json. Aquí van dentro del
           HTML porque un fetch desde file:// está bloqueado; en la versión
           servida son datos en disco, como en la app real. */
        const ATOMOS = {
    "types list #": [
        "~",
        "ƒ",
        "!",
        "$",
        "§",
        "#",
        "[]",
        "֎",
        "<",
        "{",
        ":",
        "@"
    ],
    "sigilos lista #": [
        "#",
        "~",
        "!"
    ],
    "sys #": [
        "todos #",
        "sigilos #",
        "opciones #",
        "borde #",
        "despacho #",
        "listas #",
        "valores #",
        "places ƒ #",
        "logs #"
    ],
    "diarsaba #": [
        "sys #",
        "places #",
        "escena #",
        "aislamiento #"
    ],
    "places #": [
        "escena @",
        "pruebas @"
    ],
    "todos #": [],
    "sigilos #": [
        "types list #",
        "sigilos lista #"
    ],
    "borde #": [
        "create list menu ƒ",
        "create list ƒ",
        "close menu ƒ",
        "clear menus ƒ",
        "repintar lista ƒ",
        "rect de ítem ƒ",
        "lista de menú ƒ",
        "modal input ƒ"
    ],
    "despacho #": [
        "show context menu ƒ",
        "handle click ƒ",
        "despachar menú ƒ",
        "dispatch item ƒ",
        "open submenu ƒ",
        "cerrar opciones ƒ",
        "obtener index [0] ƒ"
    ],
    "listas #": [
        "lista de ƒ",
        "ítems de menú ƒ",
        "opciones de ƒ"
    ],
    "valores #": [
        "interpretar valor ƒ",
        "mostrar valor ƒ",
        "tomado §"
    ],
    "places ƒ #": [
        "viajar a place ƒ",
        "repintar place ƒ",
        "viajar ƒ",
        "ver dentro ƒ",
        "place actual §"
    ],
    "logs #": [],
    "list option [] #": [
        "tomar ƒ",
        "cortar ƒ",
        "antes ƒ",
        "despues ƒ",
        "eliminar ƒ"
    ],
    "list option ~ #": [
        "ejecutar ƒ"
    ],
    "list option ! #": [
        "ejecutar ƒ"
    ],
    "list option $ #": [
        "editar ƒ"
    ],
    "list option § #": [
        "editar ƒ"
    ],
    "list option ƒ #": [
        "editor ƒ",
        "editar ƒ",
        "probar ƒ"
    ],
    "list option @ #": [
        "viajar ƒ",
        "ver dentro ƒ"
    ],
    "list option { #": [
        "editar ƒ",
        "repintar place ƒ"
    ],
    "menu acciones #": [
        "nuevo ƒ",
        "cerrar ƒ"
    ],
    "opciones #": [
        "menu acciones #",
        "list option [] #",
        "list option ~ #",
        "list option ! #",
        "list option $ #",
        "list option § #",
        "list option ƒ #",
        "list option @ #",
        "list option { #"
    ],
    "tomado §": "",
    "place actual §": "",
    "viajar a place ƒ": "(nombre) => {\n      const pasos = diarsaba.get(\"lista de ƒ\")(nombre);\n      if (!pasos) return false;\n      host.clearMenus(true);\n      host.limpiarLienzo(nombre);\n      diarsaba.set(\"place actual §\", nombre);\n      host.log(\"▶ <b>viajar</b> a «\" + nombre + \"» (\" + pasos.length + \" threads)\");\n      for (const paso of pasos) threads(paso);\n      return true;\n  }",
    "repintar place ƒ": "() => {\n      const nombre = diarsaba.get(\"place actual §\");\n      if (nombre) diarsaba.get(\"viajar a place ƒ\")(nombre);\n  }",
    "viajar ƒ": "(dataset) => {\n      const sel = diarsaba.get(\"obtener index [0] ƒ\")(dataset.current);\n      diarsaba.get(\"viajar a place ƒ\")(sel.texto);\n  }",
    "ver dentro ƒ": "(dataset) => {\n      const sel = diarsaba.get(\"obtener index [0] ƒ\")(dataset.current);\n      const lista = diarsaba.get(\"lista de ƒ\")(sel.texto);\n      if (!lista) return;\n      const rect = dataset.rect || { right: 40, top: 40 };\n      host.log(\"  ↳ <b>dentro</b> de «\" + sel.texto + \"»\");\n      diarsaba.get(\"create list ƒ\")(rect.right + 6, rect.top, lista, sel.texto, null, sel.texto);\n  }",
    "todos # al abrir ƒ": "(lista) => {\n      lista.length = 0;\n      for (const clave of [...diarsaba.keys()].sort()) lista.push(clave);\n  }",
    "obtener index [0] ƒ": "(texto) => {\n      const regex = /^\\[(\\d+)\\]\\s*(.*)$/;\n      const match = texto.match(regex);\n      if (!match) throw new Error('Formato inválido. Se esperaba: \"[número] texto\"');\n      return { indice: parseInt(match[1], 10), texto: match[2].trim() };\n  }",
    "create list menu ƒ": "(list, parent = \"\", current = \"\", x = null, y = null, onPick, desde = \"\") => {\n      return host.menu(list, parent, current, x, y, onPick ?? null, desde);\n  }",
    "close menu ƒ": "(id) => host.closeMenu(id)",
    "rect de ítem ƒ": "(id, index) => host.itemRect(id, index)",
    "lista de menú ƒ": "(id) => host.listaDe(id)",
    "repintar lista ƒ": "(nombre) => {\n      return host.redrawAll(nombre, diarsaba.get(\"ítems de menú ƒ\")(nombre));\n  }",
    "modal input ƒ": "async (pre) => {\n      return host.modal(pre);\n  }",
    "create list ƒ": "(x, y, list, parent, onPick, slot = \"\") => {\n      return host.list(x, y, list, parent, onPick ?? null, slot);\n  }",
    "clear menus ƒ": "() => host.clearMenus()",
    "lista de ƒ": "(nombre) => {\n      if (typeof nombre !== \"string\") return null;\n      let lista = diarsaba.get(nombre);\n      if (!Array.isArray(lista) && diarsaba.get(\"sigilos lista #\").includes(nombre.slice(-1))) {\n          lista = [];\n          diarsaba.set(nombre, lista);\n          host.log(\"· <b>nace</b> «\" + nombre + \"», vacía\");\n      }\n      return Array.isArray(lista) ? lista : null;\n  }",
    "ítems de menú ƒ": "(nombre) => diarsaba.get(\"lista de ƒ\")(nombre) || []",
    "opciones de ƒ": "(nombre) => {\n      const propias = diarsaba.get(\"list option \" + nombre.slice(-1) + \" #\");\n      return [...(Array.isArray(propias) ? propias : []),\n              ...diarsaba.get(\"list option [] #\")];\n  }",
    "interpretar valor ƒ": "(nombre, texto) => {\n      const tipo = nombre.slice(-1);\n      if (tipo === \"$\") return Number(texto);\n      if (tipo === \"ƒ\") return createFunction(texto);\n      // Un \"{\" es un diccionario: se guarda como objeto, no como su texto. Si el\n      // JSON no vale, se queda lo que había (devolver el texto lo rompería).\n      if (tipo === \"{\") { try { return JSON.parse(texto); } catch (e) { return diarsaba.get(nombre); } }\n      return texto;\n  }",
    "mostrar valor ƒ": "(valor) => {\n      if (valor === undefined || valor === null) return \"\";\n      if (typeof valor === \"function\") return String(valor);\n      return typeof valor === \"string\" ? valor : JSON.stringify(valor);\n  }",
    "editor ƒ": "async (dataset) => {\n      const sel = diarsaba.get(\"obtener index [0] ƒ\")(dataset.current);\n      const nombre = sel.texto;\n      const actual = diarsaba.get(nombre);\n      const res = await host.editor(\n          nombre,\n          actual instanceof Function ? actual.toString() : \"()=>{}\",\n          \"js\"\n      );\n      if (res == null || res.trim() === \"\") return;\n      try {\n          diarsaba.set(nombre, createFunction(res));\n          host.log(\"▶ <b>\" + nombre + \"</b> recompilada desde el editor\");\n      } catch (e) {\n          host.notify('\"' + nombre + '\" no se guardó: el código no compila.\\n\\n' + e.message);\n      }\n      diarsaba.get(\"cerrar opciones ƒ\")(dataset);\n  }",
    "editar ƒ": "async (dataset) => {\n      const sel = diarsaba.get(\"obtener index [0] ƒ\")(dataset.current);\n      const nombre = sel.texto;\n      const antes = diarsaba.get(nombre);\n      const fuente = diarsaba.get(\"mostrar valor ƒ\")(antes);\n      if (fuente.includes(\"\\n\")) {\n          host.log(\"· «\" + nombre + \"» tiene varias líneas: eso pide «<b>editor ƒ</b>», no el modal\");\n          return;\n      }\n      const texto = await diarsaba.get(\"modal input ƒ\")(fuente);\n      if (texto === null) return;\n      diarsaba.set(nombre, diarsaba.get(\"interpretar valor ƒ\")(nombre, texto));\n      host.log(\"▶ <b>\" + nombre + \"</b> = \" + texto);\n      diarsaba.get(\"cerrar opciones ƒ\")(dataset);\n  }",
    "ejecutar ƒ": "(dataset) => {\n      const sel = diarsaba.get(\"obtener index [0] ƒ\")(dataset.current);\n      host.log(\"▶ <b>ejecutar</b> «\" + sel.texto + \"»\");\n      diarsaba.get(\"cerrar opciones ƒ\")(dataset);\n      threads(sel.texto);\n  }",
    "tomar ƒ": "(dataset) => {\n      const sel = diarsaba.get(\"obtener index [0] ƒ\")(dataset.current);\n      diarsaba.set(\"tomado §\", sel.texto);\n      host.log(\"▶ <b>tomar</b> «\" + sel.texto + \"»\");\n      diarsaba.get(\"cerrar opciones ƒ\")(dataset);\n  }",
    "cortar ƒ": "(dataset) => {\n      const sel = diarsaba.get(\"obtener index [0] ƒ\")(dataset.current);\n      diarsaba.set(\"tomado §\", sel.texto);\n      diarsaba.get(dataset.parent).splice(sel.indice, 1);\n      host.log(\"▶ <b>cortar</b> «\" + sel.texto + \"»\");\n      diarsaba.get(\"cerrar opciones ƒ\")(dataset);\n  }",
    "antes ƒ": "(dataset) => {\n      const tomado = diarsaba.get(\"tomado §\");\n      if (!tomado) { host.log(\"· nada tomado todavía\"); return; }\n      const sel = diarsaba.get(\"obtener index [0] ƒ\")(dataset.current);\n      diarsaba.get(dataset.parent).splice(sel.indice, 0, tomado);\n      host.log(\"▶ <b>antes</b> de «\" + sel.texto + \"»\");\n      diarsaba.get(\"cerrar opciones ƒ\")(dataset);\n  }",
    "despues ƒ": "(dataset) => {\n      const tomado = diarsaba.get(\"tomado §\");\n      if (!tomado) { host.log(\"· nada tomado todavía\"); return; }\n      const sel = diarsaba.get(\"obtener index [0] ƒ\")(dataset.current);\n      diarsaba.get(dataset.parent).splice(sel.indice + 1, 0, tomado);\n      host.log(\"▶ <b>despues</b> de «\" + sel.texto + \"»\");\n      diarsaba.get(\"cerrar opciones ƒ\")(dataset);\n  }",
    "eliminar ƒ": "(dataset) => {\n      const sel = diarsaba.get(\"obtener index [0] ƒ\")(dataset.current);\n      diarsaba.get(dataset.parent).splice(sel.indice, 1);\n      host.log(\"▶ <b>eliminar</b> «\" + sel.texto + \"»\");\n      diarsaba.get(\"cerrar opciones ƒ\")(dataset);\n  }",
    "cerrar opciones ƒ": "(dataset) => {\n      diarsaba.get(\"close menu ƒ\")(dataset.menu);\n      diarsaba.get(\"repintar lista ƒ\")(dataset.parent);\n  }",
    "nuevo ƒ": "async (dataset) => {\n      const nombre = diarsaba.get(\"lista de menú ƒ\")(dataset.desde);\n      const lista = diarsaba.get(\"lista de ƒ\")(nombre);\n      if (!lista) return;\n      const texto = await diarsaba.get(\"modal input ƒ\")(\"\");\n      if (texto === null || texto === \"\") return;\n      lista.push(texto);\n      host.log(\"▶ <b>nuevo</b> «\" + texto + \"» en «\" + nombre + \"»\");\n      diarsaba.get(\"close menu ƒ\")(dataset.menu);\n      diarsaba.get(\"repintar lista ƒ\")(nombre);\n  }",
    "despachar menú ƒ": "async (p) => {\n      const content = p.label;\n      const rect = p.rect;\n      const dataset = { parent: p.parent, current: p.current, menu: p.menu,\n                        desde: p.desde, rect: p.rect };\n\n      host.log(\"· clic en «<b>\" + content + \"</b>»\");\n\n      // ── Ítem SIN prefijo \"[n] \" → es de MENÚ: manda el SIGILO de la derecha.\n      if (!/^\\[\\d+\\]/.test(content)) {\n          const tipo = content.slice(-1);\n          // Todo lo que es una lista por dentro se ABRE como submenú (sigue\n          // siendo menú), colgado del menú donde se pulsó. Da igual que sea una\n          // lista, un thread o una acción: mirar dentro es el mismo gesto.\n          if (diarsaba.get(\"sigilos lista #\").includes(tipo)) {\n              if (diarsaba.get(\"open submenu ƒ\")(content, rect, p.menu)) return;\n          } else if (diarsaba.get(\"types list #\").includes(tipo)) {\n              // Lo que no es una colección cobra vida según su sigilo.\n              if (diarsaba.get(\"dispatch item ƒ\")(content, dataset, rect)) return;\n          }\n          // (En la app real, aquí va la rama de los CREADORES: si existe\n          //  \"create <label> ƒ\", pide un nombre por modal y crea el átomo.)\n          //\n          // Y aquí iba el atajo para etiquetas SIN sigilo —\"· # eliminar\" y el\n          // resto de opciones—, que buscaba \"<etiqueta> ƒ\". Ya no hace falta:\n          // ahora las opciones se llaman \"eliminar ƒ\" y el sigilo las despacha\n          // como a cualquier función. Una regla menos, y una regla sola.\n          return;\n      }\n\n      // ── Ítem de LISTA \"[n] texto\": se parsea el índice y se despacha limpio.\n      // Sin esto, un \"[1] casa @\" abriría un place fantasma llamado así.\n      try {\n          const parsed = diarsaba.get(\"obtener index [0] ƒ\")(content);\n          const label = parsed.texto;\n          const handled = diarsaba.get(\"dispatch item ƒ\")(label, dataset, rect);\n          if (!handled) {\n              const fn = diarsaba.get(label + \" ƒ\") || diarsaba.get(content + \" ƒ\");\n              if (fn) fn(dataset);\n          }\n      } catch (err) { /* parseo inválido: se ignora */ }\n  }",
    "open submenu ƒ": "(nombre, rect, desde = \"\") => {\n      const lista = diarsaba.get(\"lista de ƒ\")(nombre);\n      if (!lista) return false;\n      // Una lista puede CALCULARSE en vez de guardarse: si existe un\n      // \"<nombre> al abrir ƒ\", se le da la palabra justo antes de dibujar. Con\n      // eso \"todos #\" no puede quedarse vieja — se rehace cada vez que la miras.\n      const alAbrir = diarsaba.get(nombre + \" al abrir ƒ\");\n      if (typeof alAbrir === \"function\") alAbrir(lista);\n      // \"desde\" = el menú del que cuelga: con eso el shell cierra el submenú que\n      // ese mismo menú tuviera abierto, y no se amontonan unos sobre otros.\n      diarsaba.get(\"create list menu ƒ\")(\n          diarsaba.get(\"ítems de menú ƒ\")(nombre), nombre, \"\",\n          rect.right + 6, rect.top, null, desde);\n      // Se apunta DESPUÉS de dibujar: si no, abrir «logs #» se listaría a sí mismo.\n      host.log(\"  ↳ <b>submenú</b> de «\" + nombre + \"» (\" + lista.length + \" ítems)\");\n      return true;\n  }",

    "show context menu ƒ": "() => {\n      const event = diarsaba.get(\"pointer up event\");\n\n      // En el fondo: otro menú raíz, con la lista de átomos.\n      if (event.kind === \"background\") {\n          const nombre = \"diarsaba #\";\n          diarsaba.get(\"create list menu ƒ\")(\n              diarsaba.get(\"ítems de menú ƒ\")(nombre), nombre, \"\", null, null, null, \"\");\n          return;\n      }\n      if (event.kind !== \"menu\") return;\n\n      // Sobre el TÍTULO: las acciones del MENÚ (nuevo / cerrar). Muestra SU\n      // lista, «menu acciones #», no la del menú de abajo: así sus ítems son\n      // elementos de verdad, con sus opciones y su editor. A qué menú se\n      // refieren ya lo dice \"desde\".\n      if (event.titulo) {\n          const nombre = \"menu acciones #\";\n          diarsaba.get(\"create list menu ƒ\")(\n              diarsaba.get(\"ítems de menú ƒ\")(nombre), nombre, \"\",\n              null, null, null, event.menu);\n          return;\n      }\n\n      // Sobre un ÍTEM: las opciones de ESE elemento (tomar / antes / despues /\n      // eliminar). El menú de opciones cuelga de aquél, así que se cierra con\n      // él, y lleva en su dataset a QUÉ elemento se refiere.\n      if (event.name) {\n          const lista = diarsaba.get(\"lista de ƒ\")(event.parent);\n          // Que el ítem SEA de verdad ese elemento de esa lista. Un menú de\n          // acciones u opciones cuelga de una lista pero no la muestra, y sus\n          // ítems no son elementos: aquí es donde se quedan fuera.\n          if (!Array.isArray(lista) || lista[event.index] !== event.name) return;\n          diarsaba.get(\"create list menu ƒ\")(\n              diarsaba.get(\"opciones de ƒ\")(event.name),\n              event.parent,                                  // la lista\n              \"[\" + event.index + \"] \" + event.name,         // el elemento\n              null, null, null, event.menu);\n      }\n  }",

    <script>
/* ═══════════════════════════════════════════════════════════════════════════
   EL KERNEL — el motor de threads.

   Es lo único que no es ni shell ni universo: el Map donde vive el programa,
   la compilación de átomos "ƒ" y el despacho por sigilo. No toca el DOM, no
   sabe de Tauri ni de nadie: es JS a secas, y por eso puede mudarse tal cual
   a un worker (el "universo.js" que pide T3 de CONTENEDOR.md).
   ═══════════════════════════════════════════════════════════════════════════ */

// Los átomos "ƒ" se guardan como TEXTO fuente y se compilan al arrancar.
// Es lo que permite que el programa se reescriba a sí mismo en vivo.
const createFunction = (src) => (new Function("return (" + src + ")"))();

// El programa entero es un Map global de átomos, tipados por su SIGILO final.
const diarsaba = new Map();

// Ejecuta un átomo por su SIGILO:
//   "~" thread → una SECUENCIA de nombres; cada paso se vuelve a despachar aquí,
//                así que un thread puede contener acciones y OTROS threads.
//   "!" acción → una lista [nombreDeFunción, ...argumentos].
// (La versión real envuelve cada paso en try/catch y lo apunta en la bitácora.)
function threads(name) {
    const seq = diarsaba.get(name);
    if (!Array.isArray(seq)) return;
    if (name.endsWith("~")) { for (const paso of seq) threads(paso); return; }
    const [fnName, ...args] = seq;
    const f = diarsaba.get(fnName);
    if (typeof f === "function") return f.apply(null, args);
}

// El kernel se expone también como global porque los átomos son TEXTO que se
// compila con new Function: su ámbito es el global, no este módulo. Un átomo
// que dice diarsaba.get(...) sólo puede verlo así. Es la misma razón por la
// que en la app real todo esto vive en un <script> plano.
window.diarsaba = diarsaba;
window.createFunction = createFunction;
window.threads = threads;

/* ── EL SHELL · WIDGETS ─────────────────────────────────────────────────────
   Menús, listas, modal y el registro de lo que está abierto (scene), más
   host.hit(): el clic del DOM clasificado en DATOS. Es el canal "widgets" y el
   canal "eventos" del protocolo. Nada de aquí decide: dibuja y clasifica.
   ────────────────────────────────────────────────────────────────────────── */


const widgets = {
    // Posición del puntero: los widgets sin ancla se abren ahí.
    _px: 20, _py: 20,

    // Reposiciona para que el widget no se salga de la ventana. Mide en (0,0):
    // si se coloca desbordando, el ancho shrink-to-fit se comprime y la medida
    // saldría mal.
    _clamp(el) {
        const margin = 8, vw = innerWidth, vh = innerHeight;
        const dl = parseFloat(el.style.left) || 0, dt = parseFloat(el.style.top) || 0;
        el.style.left = "0px"; el.style.top = "0px";
        const w = el.offsetWidth, h = el.offsetHeight;
        let left = dl, top = dt;
        if (left + w > vw - margin) left = vw - margin - w;
        if (top + h > vh - margin) top = vh - margin - h;
        if (left < margin) left = margin;
        if (top < margin) top = margin;
        el.style.left = `${left}px`; el.style.top = `${top}px`;
    },

    // No-string → JSON; escapa &<> para que un dato ajeno no inyecte HTML.
    _render(v) {
        const t = typeof v === "string" ? v : (() => {
            try { return JSON.stringify(v); } catch (_) { return String(v); }
        })();
        return t.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
    },

    // Entrega por DEFECTO del ítem elegido. El átomo ya no pasa una función por
    // el borde (un postMessage no puede llevarla): pasa null y el shell entrega
    // el payload. Hoy llama directo; con el worker será un postMessage.
    _deliverPick(payload) {
        const despachar = diarsaba.get("despachar menú ƒ");
        if (typeof despachar === "function") despachar(payload);
    },

    // Cablea el CLIC de un menú/lista. Al pulsar un ítem arma DATOS semánticos
    // —no el DOM— para que el universo despache sin tocar la vista.
    // stopPropagation corta el manejador global (si no, cerraría el menú antes
    // de despacharlo).
    _wirePick(div, onPick) {
        div.addEventListener("pointerup", (e) => {
            if (e.button !== 0) return;            // el clic derecho abre menú, no elige
            const item = e.target.closest && e.target.closest(".menu-item");
            if (!item || !div.contains(item)) return;
            e.stopPropagation();
            const r = item.getBoundingClientRect();
            const payload = {
                label: item.textContent,
                index: Number(item.dataset.idx),
                parent: div.dataset.parent || "",
                current: div.dataset.current || "",
                // Id del menú DONDE se pulsó, y el del menú del que ÉSE cuelga.
                // Con ellos el universo puede colgar un submenú, mandar cerrar o
                // repintar —el suyo o el de arriba— sin ver ningún elemento.
                menu: div.dataset.menu || "",
                desde: div.dataset.desde || "",
                // La caja del ítem: con ella se ancla el submenú a su derecha,
                // sin que el universo necesite ver el elemento.
                rect: {
                    left: r.left, top: r.top, right: r.right, bottom: r.bottom,
                    width: r.width, height: r.height
                },
            };
            if (onPick) onPick(payload);
            else window.host._deliverPick(payload);
        });
    },

    // Pinta los ítems dentro de un menú ya creado. El manejador de clic está
    // DELEGADO en el contenedor, así que reemplazar los ítems no lo rompe: por
    // eso repintar puede conservar el mismo menú (su id, su sitio, sus hijos).
    // Encabeza con el NOMBRE de lo que el menú muestra: con varios abiertos, es
    // lo que dice cuál es cuál — y es donde se pulsa para las acciones del menú.
    // No es un ítem, así que no altera los índices.
    // Un menú de opciones va de UN elemento (dataset.current), no de la lista.
    _paint(div, list) {
        let i = 0, html = "";
        const nombre = div.dataset.current || div.dataset.parent;
        if (nombre) html += `<span class="menu-titulo">${this._render(nombre)}</span>`;
        for (const key of list)
            html += `<span class="menu-item" data-idx="${i++}">${this._render(key)}</span>`;
        div.innerHTML = html;
    },

    // Vuelve a pintar TODOS los menús abiertos que estén mostrando esa lista.
    // Por NOMBRE y no por menú: si la misma lista está abierta en dos sitios,
    // los dos se enteran; y sirve igual para un cambio hecho a mano que para uno
    // que ocurre solo (un thread, un reloj). Los menús siguen siendo LOS MISMOS
    // —mismo id, mismo sitio, mismos hijos—, solo cambian sus ítems.
    redrawAll(nombre, list) {
        let n = 0;
        for (const [, w] of this.scene._menu) {
            // Solo los que MUESTRAN la lista: un menú de opciones cuelga de ella
            // pero enseña otra cosa, y no debe repintarse con sus datos.
            if (!w.el || w.el.dataset.parent !== nombre || w.el.dataset.current) continue;
            this._paint(w.el, list);
            this._clamp(w.el);
            n++;
        }
        return n;
    },

    // Qué lista está mostrando un menú abierto. El universo pregunta por id y
    // recibe un nombre: no ve el elemento, y no necesita que se lo arrastren
    // por el dataset.
    listaDe(id) {
        const w = this.scene._menu.get(id);
        return (w && w.el && w.el.dataset.parent) || "";
    },

    // La caja de un ítem de un menú abierto, por su ÍNDICE. Es el ancla que el
    // universo necesita para colgar un widget de un elemento que él no ve: dice
    // "el ítem 3 del menú m9" y el shell le devuelve dónde está.
    itemRect(id, index) {
        const w = this.scene._menu.get(id);
        const item = w && w.el && w.el.querySelectorAll(".menu-item")[index];
        if (!item) return null;
        const r = item.getBoundingClientRect();
        return {
            left: r.left, top: r.top, right: r.right, bottom: r.bottom,
            width: r.width, height: r.height
        };
    },

    // Pide un nombre. Resuelve el texto (Continue) o null (Cancel).
    // Es el mismo modal de la app: el shell lo dibuja y devuelve una PROMESA,
    // así el átomo solo espera un valor — con el worker, ese await ya está.
    async modal(pre = "") {
        return new Promise((resolve) => {
            const div = document.createElement("div");
            div.className = "modal-content";
            const input = document.createElement("input");
            input.type = "text"; input.value = pre || ""; input.spellcheck = false;
            const bc = document.createElement("div");
            bc.className = "modal-buttons";
            ["Cancel", "Continue"].forEach((text) => {
                const btn = document.createElement("button");
                btn.textContent = text;
                btn.dataset.modal = text.toLowerCase();
                btn.onclick = () => { div.remove(); resolve(text === "Cancel" ? null : input.value.trim()); };
                bc.append(btn);
            });
            div.append(input, bc);
            document.body.append(div);
            input.focus();
        });
    },

    // Avisos del shell (en la app real, lo mismo).
    notify(msg) { return alert(msg); },
    // MENÚ: ítems SIN prefijo. x/y null → junto al puntero.
    // "desde": id del menú DONDE SE PULSÓ; "" = es una RAÍZ (nace del fondo).
    // El shell le da un id propio y lo registra en scene: el átomo nunca recibe
    // el elemento, solo ese id de vuelta en el payload.
    menu(list, parent = "", current = "", x = null, y = null, onPick = null, desde = "") {
        const div = document.createElement("div");
        div.className = "context-menu";
        div.style.left = `${x === null ? this._px : x}px`;
        div.style.top = `${y === null ? this._py : y}px`;
        div.dataset.parent = parent;
        div.dataset.current = current;
        div.dataset.menu = window.host.scene.nuevoId();
        div.dataset.desde = desde;
        this._paint(div, list);          // después del dataset: el título lo lee de ahí
        // La marca "submenu" distingue lo que cuelga de otro menú de lo que
        // nació del fondo.
        if (desde) div.classList.add("submenu");
        document.body.appendChild(div);
        this._clamp(div);
        this._wirePick(div, onPick);
        window.host.scene.open(div.dataset.menu, div, desde);
        return div;
    },

    // LISTA: los ítems llevan el prefijo "[n] " — ésa es la marca que hace que
    // el despacho los trate con semántica de LISTA y no de menú.
    list(x, y, list, parent, onPick = null, slot = "") {
        const div = document.createElement("div");
        div.className = "context-menu";
        if (list.length == 0) div.innerHTML += `<span class="menu-item" data-idx="0">[0]</span>`;
        else {
            let i = 0; for (const key in list)
                div.innerHTML += `<span class="menu-item" data-idx="${i++}">[${key}] ${this._render(list[key])}</span>`;
        }
        div.style.left = `${x}px`;
        div.style.top = `${y}px`;
        div.dataset.parent = parent;
        document.body.appendChild(div);
        this._clamp(div);
        this._wirePick(div, onPick);
        if (slot) window.host.scene.openList(slot, div);
        return div;
    },

    // Cierra UN menú (y lo que colgara de él). Es lo que pide "cerrar ƒ".
    closeMenu(id) { this.scene.close(id); },

    // Cierra TODOS los menús. Ya no hay clic de fondo que los barra —cada menú
    // se cierra con su propia acción—, así que esto es el Esc y el cambio de
    // place.
    //
    // OJO — asimetría deliberada del original: las LISTAS no están en este
    // registro, así que SOBREVIVEN a esto: una lista abierta se queda hasta que
    // la cierres (· []* ocultar) o cambies de place. Con `alsoModals` —lo que
    // usa el cambio de place— se barre absolutamente todo.
    clearMenus(alsoModals) {
        this.scene.closeAll();
        if (alsoModals) {
            document.querySelectorAll(".context-menu, .modal-content").forEach((el) => el.remove());
            this.scene._list.clear();
        }
    },

    // Clasifica un evento de puntero en un payload SEMÁNTICO. El shell mira el
    // DOM UNA vez y entrega datos: los átomos no tocan event.target.
    hit(e) {
        const t = e && e.target;
        const p = {
            button: e.button ?? 0, clientX: e.clientX, clientY: e.clientY,
            kind: "other"
        };
        // El modal y el editor son su propia clase de sitio: teclear o pulsar
        // dentro no es ni fondo ni menú, así que no abre ni cierra nada.
        if (t && t.closest && t.closest(".modal-content, .editor-overlay")) { p.kind = "modal"; return p; }
        const menu = t && t.closest && t.closest(".context-menu");
        if (menu) {
            p.kind = "menu";
            p.menu = menu.dataset.menu || "";
            p.parent = menu.dataset.parent || "";     // la lista que muestra
            // Si el clic cayó sobre un ítem, va también CUÁL: es lo que necesita
            // el universo para abrir las opciones de ese elemento.
            const item = t.closest(".menu-item");
            if (item) { p.name = item.textContent; p.index = Number(item.dataset.idx); }
            // El TÍTULO no es un elemento de la lista: pulsarlo va del MENÚ.
            else if (t.closest(".menu-titulo")) p.titulo = true;
            return p;
        }
        if (!t || t.nodeName === "HTML" || t.nodeName === "BODY") p.kind = "background";
        return p;
    },

    // Registro de los widgets abiertos.
    scene: {
        // Los menús forman un ÁRBOL: cada uno guarda de qué menú cuelga
        // ("" = raíz, nacida de un clic derecho en el fondo). El id lo pone el
        // shell, así dos aperturas de la misma lista son dos menús distintos.
        _menu: new Map(),      // id → { el, desde }
        _list: new Map(),
        _seq: 0,
        nuevoId() { return "m" + (++this._seq); },

        // Un menú tiene como mucho UN hijo abierto: elegir otro ítem cierra lo
        // que había abierto el anterior, en vez de dibujarse encima. Las RAÍCES
        // no se estorban entre sí — por eso cada clic derecho suma un menú.
        open(id, el, desde = "") {
            if (desde) this.closeChildren(desde);
            this._menu.set(id, { el, desde });
        },

        // Cerrar un menú se lleva por delante todo lo que colgaba de él.
        close(id) {
            const w = this._menu.get(id);
            if (!w) return;
            this.closeChildren(id);
            if (w.el?.remove) w.el.remove();
            this._menu.delete(id);
        },
        closeChildren(id) {
            for (const [k, w] of [...this._menu]) if (w.desde === id) this.close(k);
        },
        closeAll() { for (const k of [...this._menu.keys()]) this.close(k); },
        // Sin la marca "submenu" a propósito: una lista abierta no la barre
        // "clear menus ƒ" (ver el comentario de clearMenus).
        openList(name, el) {
            const prev = this._list.get(name);
            if (prev?.remove) prev.remove();
            this._list.set(name, el);
        },
    },

    // (solo del DEMO) bitácora: cada línea se anota en el átomo "logs #", que
    // se abre desde el menú principal como cualquier otra lista. No hay vista
    // aparte: la propia bitácora es un átomo del programa.
    log(html) {
        const bitacora = diarsaba.get("logs #");
        if (!Array.isArray(bitacora)) return;
        bitacora.unshift(html.replace(/<[^>]+>/g, ""));   // sin marcas: es texto
        while (bitacora.length > 40) bitacora.pop();
    },
};

/* ── EL SHELL · EL LIENZO DE UN PLACE ───────────────────────────────────────
   Tres verbos de dibujo y nada más: círculo, trazo, texto. El shell no sabe
   qué es un árbol; recibe un color CSS ya resuelto, coordenadas en % y un z.
   Aquí es DOM+SVG; en otro shell serían Three.js o un canvas, con los mismos
   tres verbos — es el canal "escena" del protocolo.
   ────────────────────────────────────────────────────────────────────────── */

const lienzo = {
    /* ── EL LIENZO ─────────────────────────────────────────────────────────
       Tres verbos y nada más: borrar el lienzo, poner un círculo, poner un
       trazo. El shell no sabe qué es un árbol ni qué es el sol: recibe un
       color CSS ya resuelto, unas coordenadas en % y un z, y dibuja. Quién
       decide que "amarillo" es #ffd21e, o que el follaje son veinte círculos
       esparcidos, es el universo.                                            */

    _lienzo() { return document.getElementById("lienzo"); },

    // El escenario mide 200×200 y se escala a la ventana: así una escena
    // escrita en % y px se ve igual en cualquier pantalla.
    _escalar() {
        const escala = Math.min(innerWidth, innerHeight) * 0.86 / 200;
        document.documentElement.style.setProperty("--escala", escala.toFixed(3));
    },

    // Vaciar el lienzo. Es lo primero que pasa al viajar a un place.
    limpiarLienzo(nombre = "") {
        const el = this._lienzo();
        if (el) el.innerHTML = "";
        this._escalar();
        document.getElementById("place-nombre").textContent = nombre;
    },

    // Un círculo, anclado por su centro en (x%, y%) del lienzo.
    circulo(color, tamano, x, y, z) {
        const el = this._lienzo();
        if (!el) return;
        const d = document.createElement("div");
        d.className = "escena-circulo";
        d.style.left = `${x}%`;
        d.style.top = `${y}%`;
        d.style.width = tamano;
        d.style.height = tamano;
        d.style.background = color;
        d.style.zIndex = String(z);
        el.appendChild(d);
    },

    // Una línea continua que une los puntos [[x,y], ...], en las mismas
    // coordenadas 0..100 de la escena.
    trazo(color, grosor, z, puntos) {
        const el = this._lienzo();
        if (!el || !Array.isArray(puntos) || puntos.length < 2) return;
        const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        svg.setAttribute("class", "escena-trazo");
        svg.setAttribute("viewBox", "0 0 100 100");
        svg.setAttribute("preserveAspectRatio", "none");
        svg.style.zIndex = String(z);
        const linea = document.createElementNS("http://www.w3.org/2000/svg", "polyline");
        linea.setAttribute("points", puntos.map((p) => p[0] + "," + p[1]).join(" "));
        linea.setAttribute("fill", "none");
        linea.setAttribute("stroke", color);
        linea.setAttribute("stroke-width", grosor);
        linea.setAttribute("stroke-linecap", "round");
        linea.setAttribute("stroke-linejoin", "round");
        // El grosor no se estira con el viewBox: se queda en px del escenario.
        linea.setAttribute("vector-effect", "non-scaling-stroke");
        svg.appendChild(linea);
        el.appendChild(svg);
    },

    // Una línea de texto en el lienzo. El shell escapa lo que le llegue: un
    // texto que viene de fuera (del sandbox, por ejemplo) es un dato, no HTML.
    texto(color, tamano, x, y, z, contenido) {
        const el = this._lienzo();
        if (!el) return;
        const d = document.createElement("div");
        d.className = "escena-texto";
        d.style.left = `${x}%`;
        d.style.top = `${y}%`;
        d.style.fontSize = tamano;
        d.style.color = color;
        d.style.zIndex = String(z);
        d.textContent = String(contenido);
        el.appendChild(d);
    },
};

/* ── EL SHELL · EL EDITOR ───────────────────────────────────────────────────
   Monaco vive aquí, en el shell, igual que en la app: el universo sólo dice
   "edítame este texto" y recibe el resultado. Si Monaco no aparece se edita en
   un textarea y el programa sigue — el editor es una comodidad del shell, no
   una dependencia del universo.
   ────────────────────────────────────────────────────────────────────────── */

const editor = {
    /* ── EL EDITOR ─────────────────────────────────────────────────────────
       Monaco vive en el SHELL, igual que en la app: el universo solo dice
       "edítame este texto" y recibe el resultado. Se carga de la copia del
       repo (frontend/public/vs), sin CDN.                                    */

    _monaco: null,

    _cargarScript(src) {
        return new Promise((resolve) => {
            const s = document.createElement("script");
            s.src = src;
            s.onload = () => resolve(true);
            s.onerror = () => resolve(false);
            document.head.appendChild(s);
        });
    },

    _cargarMonaco() {
        if (this._monaco) return this._monaco;
        this._monaco = (async () => {
            if (window.monaco) return window.monaco;
            // Dónde buscar Monaco. Si el anfitrión lo dijo al crear el host
            // (crearHost({ vs })), se usa eso y no se adivina — es lo que hará
            // Tauri, que sirve sus assets desde donde quiera. Si no, se prueban
            // las rutas de siempre: la raíz servida (donde lo pone Vite y donde
            // lo pide la app real) y public/vs del repo. Gana la primera que
            // conteste, y si no contesta ninguna se edita en un textarea.
            const bases = [];
            if (this._vs) bases.push(new URL(this._vs, location.href).href);
            if (location.protocol !== "file:") bases.push(new URL("/", location.href).href);
            bases.push(new URL("../../public/", location.href).href);
            let base = null;
            for (const b of bases) if (await this._cargarScript(b + "vs/loader.js")) { base = b; break; }
            if (!base) throw new Error("no se encontró vs/loader.js en: " + bases.join(" , "));

            const vs = base + "vs";
            window.require.config({ paths: { vs } });
            // El worker se pide por data: URL, igual que en la app. Si el
            // navegador lo bloquea, Monaco se cae solo al hilo principal y
            // sigue editando.
            window.MonacoEnvironment = {
                getWorkerUrl: () => "data:text/javascript;charset=utf-8," + encodeURIComponent(
                    `self.MonacoEnvironment={baseUrl:'${base}'};` +
                    `importScripts('${vs}/base/worker/workerMain.js');`),
            };
            return new Promise((resolve, reject) => {
                window.require(["vs/editor/editor.main"], () => {
                    // El tema del proyecto, para que el editor no desentone.
                    window.monaco.editor.defineTheme("glass-dark", {
                        base: "vs-dark", inherit: true, rules: [],
                        colors: {
                            "editor.background": "#0b0b0b42",
                            "editorGutter.background": "#0b0b0b24",
                            "editorLineNumber.foreground": "#94a3b8",
                            "editorCursor.foreground": "#f8fafc",
                            "editor.selectionBackground": "#ffffff18",
                            "editor.lineHighlightBackground": "#ffffff08",
                            "focusBorder": "#00000000",
                            "scrollbarSlider.background": "#ffffff14",
                        },
                    });
                    resolve(window.monaco);
                }, reject);
            });
        })();
        return this._monaco;
    },

    // Abre el editor. Resuelve el texto (Guardar) o null (Cancel) — la misma
    // firma que host.editor en la app, para que el átomo sea el mismo.
    async editor(nombre, src = "", lang = "javascript") {
        const monaco = await this._cargarMonaco().catch((e) => {
            console.warn("[demo] Monaco no disponible:", e.message);
            return null;                       // se edita en un textarea y ya
        });
        return new Promise((resolve) => {
            const overlay = document.createElement("div");
            overlay.className = "editor-overlay";
            overlay.innerHTML =
                `<div class="editor-modal">
             <div class="editor-header">
                 <span class="editor-title">${this._render(nombre)}</span>
                 <div class="modal-buttons"></div>
             </div>
             <div class="monaco-container"></div>
         </div>`;
            const cont = overlay.querySelector(".monaco-container");
            const bc = overlay.querySelector(".modal-buttons");
            document.body.append(overlay);
            // Cerrar DESTRUYE el editor: quitar el overlay no basta, Monaco
            // guarda cada instancia (y su modelo) en un registro propio, y las
            // que quedaran vivas seguirían apareciendo en monaco.editor.getEditors().
            let ed = null;
            const cerrar = (v) => { if (ed) ed.dispose(); overlay.remove(); resolve(v); };

            let leer;
            if (monaco) {
                const idioma = { js: "javascript", text: "plaintext" }[lang] || lang;
                ed = monaco.editor.create(cont, {
                    value: src, language: idioma, theme: "glass-dark",
                    automaticLayout: true, minimap: { enabled: false },
                    scrollBeyondLastLine: false, tabSize: 4, fontSize: 13,
                    fontFamily: getComputedStyle(document.body).fontFamily,
                });
                ed.addCommand(monaco.KeyCode.Escape, () => cerrar(null));
                ed.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.KeyS, () => cerrar(ed.getValue()));
                leer = () => ed.getValue();
                ed.focus();
            } else {
                const ta = document.createElement("textarea");
                ta.value = src; ta.spellcheck = false;
                cont.append(ta);
                leer = () => ta.value;
                ta.focus();
            }
            // El Esc del editor no debe llegar al de la ventana (que barre menús).
            overlay.addEventListener("keydown", (e) => {
                if (e.key !== "Escape") return;
                e.stopPropagation();
                cerrar(null);
            });
            ["Cancel", "Guardar"].forEach((text) => {
                const btn = document.createElement("button");
                btn.textContent = text;
                btn.dataset.modal = text === "Guardar" ? "continue" : "cancel";
                btn.onclick = () => cerrar(text === "Cancel" ? null : leer());
                bc.append(btn);
            });
        });
    },
};

/* ── EL SHELL · EL AISLAMIENTO ──────────────────────────────────────────────
   Correr un átomo que no es de fiar. Aquí es un Web Worker con un reloj
   encima; en la app puede ser workerd o el sandbox que el anfitrión ofrezca.
   El universo sólo ve el verbo host.worker(fuente, args, ms) y un veredicto.
   ────────────────────────────────────────────────────────────────────────── */

const aislamiento = {
    /* ── EL AISLAMIENTO (worker) ───────────────────────────────────────────
       Correr un átomo que NO es de fiar: puede colgarse, reventar o intentar
       tocar lo que no es suyo. Vive en un worker, que es un mundo aparte —sin
       document, sin el Map, sin nada de aquí—, y con un reloj encima: si no
       contesta a tiempo se le termina y ya está. Aquí es un Web Worker; en la
       app (Go/Wails) el mismo verbo lo cumple workerd.

       Lo que vuelve son DATOS. Si el átomo quiere dibujar, devuelve una lista
       de acciones y las pinta el universo de casa: nada del sandbox llega al
       DOM, ni siquiera indirectamente.                                       */

    // El único código que se le confía al worker: recibe una fuente, la
    // compila allí dentro y devuelve lo que salga —o el error.
    _sandbox: `
self.onmessage = (e) => {
    const { src, args } = e.data;
    try {
        const f = (new Function("return (" + src + ")"))();
        if (typeof f !== "function") { self.postMessage({ ok: false, motivo: "no es función" }); return; }
        const valor = f.apply(null, args || []);
        // Sólo lo estructurable cruza de vuelta: una función o un elemento
        // no pueden viajar por un postMessage, y eso es una garantía, no un
        // límite.
        self.postMessage({ ok: true, valor: JSON.parse(JSON.stringify(valor ?? null)) });
    } catch (err) {
        self.postMessage({ ok: false, motivo: "reventó", error: String((err && err.message) || err) });
    }
};`,

    // Corre una fuente aislada y resuelve SIEMPRE, con un veredicto:
    //   { ok:true, valor }                        · contestó
    //   { ok:false, motivo:"colgada" }            · se le terminó el tiempo
    //   { ok:false, motivo:"reventó", error }     · lanzó
    //   { ok:false, motivo:"sin aislamiento" }    · no hay worker: NO se ejecuta
    // Nunca lanza y nunca se queda esperando: por eso un while(true) no se
    // lleva por delante la página.
    async worker(src, args = [], ms = 800) {
        // El reloj se pone en marcha DESPUÉS de tener el worker: arrancarlo cuesta
        // unos milisegundos que no son del átomo. Aun así lo que se mide es tiempo
        // de pared, así que un "colgada" puede pasarse del plazo: el aviso llega
        // cuando el hilo de casa vuelve a mirar.
        let t0 = performance.now();
        const tiempo = () => Math.round(performance.now() - t0);
        let w = null, url = null;
        try {
            url = URL.createObjectURL(new Blob([this._sandbox], { type: "text/javascript" }));
            w = new Worker(url);
        } catch (e) {
            // Sin sandbox no se ejecuta NADA. Correr en el hilo principal algo
            // que puede no terminar sería exactamente lo que se quiere evitar.
            if (url) URL.revokeObjectURL(url);
            return { ok: false, motivo: "sin aislamiento", error: String(e.message || e), ms: tiempo() };
        }
        t0 = performance.now();
        return new Promise((resolve) => {
            let cerrado = false;
            const cerrar = (r) => {
                if (cerrado) return;
                cerrado = true;
                clearTimeout(reloj);
                w.terminate();                 // esto es lo que mata un bucle infinito
                URL.revokeObjectURL(url);
                resolve({ ...r, ms: tiempo() });
            };
            const reloj = setTimeout(() => cerrar({ ok: false, motivo: "colgada" }), ms);
            w.onmessage = (e) => cerrar(e.data);
            w.onerror = (e) => {
                if (e.preventDefault) e.preventDefault();
                cerrar({ ok: false, motivo: "reventó", error: e.message || "error en el worker" });
            };
            w.postMessage({ src, args });
        });
    },
};

/* ── EL SHELL · EL BROKER ───────────────────────────────────────────────────
   El canal 3 del protocolo: lo que el universo no puede hacer solo porque
   vive fuera de él — guardar, cargar, hablar con otra máquina.

   Aquí está NULO a propósito. Cada verbo existe, contesta algo honesto y lo
   apunta en la bitácora, así que el programa entero funciona sin anfitrión: se
   abre en un navegador y no falta nada más que la persistencia y la red. Eso
   es lo que hace este lado portable — no hay un Go escondido del que dependa.

   PARA ENCHUFARLO EN TAURI: no se toca ningún átomo. Se implementa este mismo
   objeto contra invoke() y se pasa a crearHost({ broker }). Los átomos siguen
   diciendo host.broker.kv.set(...) y no se enteran de quién contesta:

       import { invoke } from "@tauri-apps/api/core";
       const brokerTauri = {
           kv: {
               set: (k, v) => invoke("kv_set", { clave: k, valor: v }),
               get: (k)    => invoke("kv_get", { clave: k }),
               ...
           },
           p2p: {                                    // tu librería de Go, aparte
               anunciar: (a)     => invoke("p2p_anunciar", a),
               abrirStream: (id) => invoke("p2p_abrir_stream", { id }),
               ...
           },
           al: (evento, cb) => escuchar(evento, cb),  // eventos entrantes
       };

   Los nombres de abajo salen del inventario del borde de CONTENEDOR.md
   (kv.set/get/delete/history/restore, export/save/load, p2p.*, ai, reload),
   con la firma mínima. Ampliar es añadir un verbo, no rediseñar nada.
   ────────────────────────────────────────────────────────────────────────── */

// Lo que devuelve un verbo que no está enchufado. No lanza: un anfitrión
// ausente es un dato, no un error — igual que un átomo que no termina.
const sinAnfitrion = (verbo) => {
    if (window.host && window.host.log) window.host.log("· sin anfitrión: <b>" + verbo + "</b>");
    return { ok: false, motivo: "sin anfitrión", verbo };
};

const brokerNulo = {
    nombre: "nulo",

    // Almacén por clave. En la app real es un bbolt por universo; en Tauri, lo
    // que decidas (sqlite, ficheros, el store de Tauri).
    kv: {
        set: (clave, valor) => sinAnfitrion("kv.set " + clave),
        get: (clave) => sinAnfitrion("kv.get " + clave),
        delete: (clave) => sinAnfitrion("kv.delete " + clave),
        history: (clave) => sinAnfitrion("kv.history " + clave),
        restore: (clave, version) => sinAnfitrion("kv.restore " + clave),
    },

    // El programa entero, entrando y saliendo. "export" no necesita anfitrión:
    // el universo ya sabe serializarse, así que esto se puede resolver aquí y
    // es lo único del broker que funciona de verdad sin backend.
    exportar: () => {
        const salida = {};
        for (const [k, v] of window.diarsaba) {
            if (typeof v === "function") salida[k] = v.toString();
            else if (typeof v !== "undefined") salida[k] = v;
        }
        return { ok: true, valor: salida };
    },
    guardar: () => sinAnfitrion("guardar"),
    cargar: () => sinAnfitrion("cargar"),

    // La única pieza que te llevas de Go, y vive detrás de estos verbos: el
    // universo nunca ve un socket, sólo pide "anuncia" o "abre un stream".
    p2p: {
        arrancar: (opciones) => sinAnfitrion("p2p.arrancar"),
        anunciar: (anuncio) => sinAnfitrion("p2p.anunciar"),
        abrirStream: (par) => sinAnfitrion("p2p.abrirStream"),
        escribir: (id, datos) => sinAnfitrion("p2p.escribir"),
        leer: (id) => sinAnfitrion("p2p.leer"),
        cerrar: (id) => sinAnfitrion("p2p.cerrar"),
    },

    // El asistente del editor. Igual que el resto: un verbo, no una integración.
    ai: (codigo, lang, instruccion, system) => sinAnfitrion("ai"),

    // Recargar el anfitrión (en un navegador, la página).
    recargar: () => location.reload(),

    // Eventos que llegan de fuera (un stream p2p entrante, por ejemplo). El
    // universo registra un nombre y una función; el anfitrión la llama. Sin
    // anfitrión no llega nada, y registrarse no cuesta nada.
    _oyentes: new Map(),
    al(evento, fn) {
        if (!this._oyentes.has(evento)) this._oyentes.set(evento, []);
        this._oyentes.get(evento).push(fn);
        return () => {
            const l = this._oyentes.get(evento) || [];
            const i = l.indexOf(fn);
            if (i >= 0) l.splice(i, 1);
        };
    },
    // Lo llama el ANFITRIÓN para entregar un evento. Está aquí, y no en el
    // universo, porque quien lo dispara es de fuera.
    emitir(evento, datos) {
        for (const fn of this._oyentes.get(evento) || []) {
            try { fn(datos); } catch (e) { console.warn("[broker] oyente de", evento, e); }
        }
    },
};

/* ═══════════════════════════════════════════════════════════════════════════
   EL SHELL — el borde entero, en un objeto.

   El universo le habla por verbos y nunca ve un elemento del DOM. Se ensambla
   de piezas: widgets (menús/listas/modal/eventos), lienzo (los tres verbos de
   dibujo), editor (Monaco), aislamiento (el worker) y broker (lo de fuera).

   Cambiar de anfitrión es cambiar piezas, no átomos. Un shell de Tauri con
   Three.js en vez de divs sería este mismo archivo con otro lienzo.js.
   ═══════════════════════════════════════════════════════════════════════════ */






function crearHost({ broker = brokerNulo, vs = null } = {}) {
    const host = {
        ...widgets,
        ...lienzo,
        ...editor,
        ...aislamiento,
        broker,
        // Dónde está Monaco. Si se pasa, se usa esa ruta y no se adivina; si no,
        // _cargarMonaco prueba las de siempre y, si no hay ninguna, se edita en
        // un textarea. El editor nunca es motivo de que nada falle.
        _vs: vs,
    };

    // Global a propósito: los átomos son TEXTO compilado con new Function, así
    // que su ámbito es el global. Un átomo que dice host.menu(...) sólo puede
    // verlo aquí. Es el mismo trato que el kernel.
    window.host = host;
    return host;
}

function sembrar(atomos) {
    let n = 0;
    for (const [nombre, valor] of Object.entries(atomos)) {
        try {
            diarsaba.set(nombre, nombre.endsWith("ƒ") ? createFunction(valor) : valor);
            n++;
        } catch (e) {
            // Un átomo que no compila no se lleva por delante a los demás: se
            // queda fuera y se dice cuál. Sembrar a medias es mejor que no
            // arrancar, porque el que falta se puede escribir desde el menú.
            console.warn(`[cargador] «${nombre}» no compila, se queda fuera:`, e.message);
        }
    }
    return n;
}

/* ═══════════════════════════════════════════════════════════════════════════
   EL ARRANQUE — el único archivo que sabe en qué anfitrión estamos.

   Monta el shell, siembra el universo, entrega los gestos y viaja a un place.
   Todo lo demás (kernel, shell, átomos) no sabe nada de esto: para llevar el
   paquete a otro anfitrión se cambia ESTE archivo y nada más.
   ═══════════════════════════════════════════════════════════════════════════ */




// ── 1. EL SHELL ────────────────────────────────────────────────────────────
// En Tauri: crearHost({ broker: brokerTauri, vs: "/vs/" }). Ni un átomo cambia.
const host = crearHost();

// ── 2. EL UNIVERSO ─────────────────────────────────────────────────────────
const sembrados = sembrar(ATOMOS);   // incrustados por empaquetar.mjs

// ── 3. LOS GESTOS ──────────────────────────────────────────────────────────
// Entran por aquí y se entregan al universo ya CLASIFICADOS por host.hit(). En
// la app real esto vive en "on start ƒ"; con el worker, la entrega será un
// postMessage y este bloque es justo el que se muda al shell.
addEventListener("contextmenu", (e) => e.preventDefault());
// Esc barre TODO (menús + listas): es lo que hace el cambio de place con
// host.clearMenus(true). De uno en uno, cada menú se cierra con su "cerrar ƒ".
addEventListener("keydown", (e) => { if (e.key === "Escape") host.clearMenus(true); });
addEventListener("pointerup", (e) => {
    diarsaba.set("pointer up event", host.hit(e));
    if (e.button === 0) diarsaba.get("handle click ƒ")();
    if (e.button === 2) diarsaba.get("show context menu ƒ")();
});
addEventListener("pointermove", (e) => { host._px = e.clientX; host._py = e.clientY; });
// El escenario se reajusta con la ventana: la escena no se recalcula, sólo se
// escala — es la misma, más grande.
addEventListener("resize", () => host._escalar());

// ── 4. EL PLACE ────────────────────────────────────────────────────────────
// Arrancar EN un place: el programa siempre está en algún sitio. Se viaja como
// se viajaría desde el menú, con el mismo átomo.
diarsaba.get("viajar a place ƒ")("escena @");

host.log(sembrados + " átomos · broker «" + host.broker.nombre + "»");
host.log("listo — clic derecho en el fondo abre un menú; sobre un ítem, sus opciones");
    </script>
