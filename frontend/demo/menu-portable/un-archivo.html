    <script>
/* ═══════════════════════════════════════════════════════════════════════════
   EL KERNEL — el motor de threads.

   Es lo único que no es ni shell ni universo: el Map donde vive el programa,
   la compilación de átomos "ƒ" y el despacho por sigilo. No toca el DOM, no
   sabe de Tauri ni de nadie: es JS a secas, y por eso puede mudarse tal cual
   a un worker (el "universo.js" que pide T3 de CONTENEDOR.md).
   ═══════════════════════════════════════════════════════════════════════════ */

// Los átomos "ƒ" se guardan como TEXTO fuente y se compilan al arrancar.
// Es lo que permite que el programa se reescriba a sí mismo en vivo.
const createFunction = (src) => (new Function("return (" + src + ")"))();

// El programa entero es un Map global de átomos, tipados por su SIGILO final.
const diarsaba = new Map();

// Ejecuta un átomo por su SIGILO:
//   "~" thread → una SECUENCIA de nombres; cada paso se vuelve a despachar aquí,
//                así que un thread puede contener acciones y OTROS threads.
//   "!" acción → una lista [nombreDeFunción, ...argumentos].
// (La versión real envuelve cada paso en try/catch y lo apunta en la bitácora.)
function threads(name) {
    const seq = diarsaba.get(name);
    if (!Array.isArray(seq)) return;
    if (name.endsWith("~")) { for (const paso of seq) threads(paso); return; }
    const [fnName, ...args] = seq;
    const f = diarsaba.get(fnName);
    if (typeof f === "function") return f.apply(null, args);
}

// El kernel se expone también como global porque los átomos son TEXTO que se
// compila con new Function: su ámbito es el global, no este módulo. Un átomo
// que dice diarsaba.get(...) sólo puede verlo así. Es la misma razón por la
// que en la app real todo esto vive en un <script> plano.
window.diarsaba = diarsaba;
window.createFunction = createFunction;
window.threads = threads;

/* ── EL SHELL · WIDGETS ─────────────────────────────────────────────────────
   Menús, listas, modal y el registro de lo que está abierto (scene), más
   host.hit(): el clic del DOM clasificado en DATOS. Es el canal "widgets" y el
   canal "eventos" del protocolo. Nada de aquí decide: dibuja y clasifica.
   ────────────────────────────────────────────────────────────────────────── */


const widgets = {
    // Posición del puntero: los widgets sin ancla se abren ahí.
    _px: 20, _py: 20,

    // Reposiciona para que el widget no se salga de la ventana. Mide en (0,0):
    // si se coloca desbordando, el ancho shrink-to-fit se comprime y la medida
    // saldría mal.
    _clamp(el) {
        const margin = 8, vw = innerWidth, vh = innerHeight;
        const dl = parseFloat(el.style.left) || 0, dt = parseFloat(el.style.top) || 0;
        el.style.left = "0px"; el.style.top = "0px";
        const w = el.offsetWidth, h = el.offsetHeight;
        let left = dl, top = dt;
        if (left + w > vw - margin) left = vw - margin - w;
        if (top + h > vh - margin) top = vh - margin - h;
        if (left < margin) left = margin;
        if (top < margin) top = margin;
        el.style.left = `${left}px`; el.style.top = `${top}px`;
    },

    /* ── EL CONTRATO DEL MARCADO ───────────────────────────────────────────
       El shell ya no construye el menú: lo recibe hecho, del átomo «menu <».
       Pero para convertir un clic en un dato tiene que reconocer dos cosas en
       ese marcado, y sólo dos:

           .menu-item[data-idx="N"]   un ítem, y qué índice tiene
           .menu-titulo               el título (pulsarlo va DEL MENÚ)

       Eso es todo lo que sabe de la forma de un menú. Cambia el marcado como
       quieras —otras etiquetas, más adornos, otro orden— y seguirá funcionando
       mientras esos dos ganchos existan. No es una forma: es dónde mirar. */

    // Entrega por DEFECTO del ítem elegido. El átomo ya no pasa una función por
    // el borde (un postMessage no puede llevarla): pasa null y el shell entrega
    // el payload. Hoy llama directo; con el worker será un postMessage.
    _deliverPick(payload) {
        const despachar = diarsaba.get("despachar menú ƒ");
        if (typeof despachar === "function") despachar(payload);
    },

    // Cablea el CLIC de un menú/lista. Al pulsar un ítem arma DATOS semánticos
    // —no el DOM— para que el universo despache sin tocar la vista.
    // stopPropagation corta el manejador global (si no, cerraría el menú antes
    // de despacharlo).
    _wirePick(div, onPick) {
        div.addEventListener("pointerup", (e) => {
            if (e.button !== 0) return;            // el clic derecho abre menú, no elige
            const item = e.target.closest && e.target.closest(".menu-item");
            if (!item || !div.contains(item)) return;
            e.stopPropagation();
            const r = item.getBoundingClientRect();
            const payload = {
                label: item.textContent,
                index: Number(item.dataset.idx),
                parent: div.dataset.parent || "",
                current: div.dataset.current || "",
                // Id del menú DONDE se pulsó, y el del menú del que ÉSE cuelga.
                // Con ellos el universo puede colgar un submenú, mandar cerrar o
                // repintar —el suyo o el de arriba— sin ver ningún elemento.
                menu: div.dataset.menu || "",
                desde: div.dataset.desde || "",
                // La caja del ítem: con ella se ancla el submenú a su derecha,
                // sin que el universo necesite ver el elemento.
                rect: {
                    left: r.left, top: r.top, right: r.right, bottom: r.bottom,
                    width: r.width, height: r.height
                },
            };
            if (onPick) onPick(payload);
            else window.host._deliverPick(payload);
        });
    },

    // Pinta los ítems dentro de un menú ya creado. El manejador de clic está
    // DELEGADO en el contenedor, así que reemplazar los ítems no lo rompe: por
    // eso repintar puede conservar el mismo menú (su id, su sitio, sus hijos).
    // Encabeza con el NOMBRE de lo que el menú muestra: con varios abiertos, es
    // lo que dice cuál es cuál — y es donde se pulsa para las acciones del menú.
    // No es un ítem, así que no altera los índices.
    // Un menú de opciones va de UN elemento (dataset.current), no de la lista.
    // Los menús ABIERTOS que están mostrando esa lista, por su id. El universo
    // pregunta "¿quién enseña «logs #»?" y recibe ids, no elementos — con eso
    // decide a quién repintar. Antes esto era redrawAll(), que además PINTABA;
    // ahora pintar es del universo y aquí sólo queda la pregunta.
    //
    // Sólo los que la MUESTRAN: un menú de opciones cuelga de una lista pero
    // enseña otra cosa, y no debe repintarse con sus datos.
    menusDe(nombre) {
        const ids = [];
        for (const [id, w] of this.scene._menu)
            if (w.el && w.el.dataset.parent === nombre && !w.el.dataset.current) ids.push(id);
        return ids;
    },

    // Cambia el contenido de un menú abierto, conservándolo: mismo id, mismo
    // sitio, mismos hijos. Es lo que hace que editar un elemento se VEA sin
    // cerrar nada. El manejador de clic está delegado en el contenedor, así que
    // reemplazar el marcado de dentro no lo rompe.
    repintar(id, html) {
        const w = this.scene._menu.get(id);
        if (!w || !w.el) return false;
        w.el.innerHTML = String(html);
        this._clamp(w.el);
        return true;
    },

    // Qué lista está mostrando un menú abierto. El universo pregunta por id y
    // recibe un nombre: no ve el elemento, y no necesita que se lo arrastren
    // por el dataset.
    listaDe(id) {
        const w = this.scene._menu.get(id);
        return (w && w.el && w.el.dataset.parent) || "";
    },

    // La caja de un ítem de un menú abierto, por su ÍNDICE. Es el ancla que el
    // universo necesita para colgar un widget de un elemento que él no ve: dice
    // "el ítem 3 del menú m9" y el shell le devuelve dónde está.
    itemRect(id, index) {
        const w = this.scene._menu.get(id);
        const item = w && w.el && w.el.querySelectorAll(".menu-item")[index];
        if (!item) return null;
        const r = item.getBoundingClientRect();
        return {
            left: r.left, top: r.top, right: r.right, bottom: r.bottom,
            width: r.width, height: r.height
        };
    },

    // Pide un nombre. Resuelve el texto (Continue) o null (Cancel).
    // Es el mismo modal de la app: el shell lo dibuja y devuelve una PROMESA,
    // así el átomo solo espera un valor — con el worker, ese await ya está.
    async modal(pre = "") {
        return new Promise((resolve) => {
            const div = document.createElement("div");
            div.className = "modal-content";
            const input = document.createElement("input");
            input.type = "text"; input.value = pre || ""; input.spellcheck = false;
            const bc = document.createElement("div");
            bc.className = "modal-buttons";
            ["Cancel", "Continue"].forEach((text) => {
                const btn = document.createElement("button");
                btn.textContent = text;
                btn.dataset.modal = text.toLowerCase();
                btn.onclick = () => { div.remove(); resolve(text === "Cancel" ? null : input.value.trim()); };
                bc.append(btn);
            });
            div.append(input, bc);
            document.body.append(div);
            input.focus();
        });
    },

    // Avisos del shell (en la app real, lo mismo).
    notify(msg) { return alert(msg); },

    // MENÚ. Recibe el HTML ya hecho —del átomo «menu <»— y se encarga de lo que
    // no es forma: darle un id, ponerlo en su sitio sin que se salga de la
    // ventana, cablear el clic y colgarlo del árbol.
    //
    // "desde": id del menú DONDE SE PULSÓ; "" = es una RAÍZ (nace del fondo).
    // El átomo nunca recibe el elemento, sólo el id de vuelta.
    //
    // Los datos (parent/current) se guardan en el dataset porque son lo que el
    // shell devuelve en el payload de un clic: no los usa para dibujar —ya no
    // dibuja—, los custodia.
    menu(html, parent = "", current = "", x = null, y = null, onPick = null, desde = "") {
        const div = document.createElement("div");
        div.className = "context-menu";
        div.style.left = `${x === null ? this._px : x}px`;
        div.style.top = `${y === null ? this._py : y}px`;
        div.dataset.parent = parent;
        div.dataset.current = current;
        div.dataset.menu = window.host.scene.nuevoId();
        div.dataset.desde = desde;
        div.innerHTML = String(html);
        // La marca "submenu" distingue lo que cuelga de otro menú de lo que
        // nació del fondo.
        if (desde) div.classList.add("submenu");
        document.body.appendChild(div);
        this._clamp(div);
        this._wirePick(div, onPick);
        window.host.scene.open(div.dataset.menu, div, desde);
        return div.dataset.menu;
    },

    // Cierra UN menú (y lo que colgara de él). Es lo que pide "cerrar ƒ".
    closeMenu(id) { this.scene.close(id); },

    // Cierra TODOS los menús. Ya no hay clic de fondo que los barra —cada menú
    // se cierra con su propia acción—, así que esto es el Esc y el cambio de
    // place.
    //
    // (Aquí había una asimetría heredada: las LISTAS iban en otro registro y
    //  sobrevivían al Esc. Ya no hay listas —todo es el árbol de menús—, así que
    //  la excepción se fue con ellas. `alsoModals` barre además los modales, y
    //  es lo que usa el cambio de place.)
    clearMenus(alsoModals) {
        this.scene.closeAll();
        if (alsoModals)
            document.querySelectorAll(".context-menu, .modal-content").forEach((el) => el.remove());
    },

    // Clasifica un evento de puntero en un payload SEMÁNTICO. El shell mira el
    // DOM UNA vez y entrega datos: los átomos no tocan event.target.
    hit(e) {
        const t = e && e.target;
        const p = {
            button: e.button ?? 0, clientX: e.clientX, clientY: e.clientY,
            kind: "other"
        };
        // El modal y el editor son su propia clase de sitio: teclear o pulsar
        // dentro no es ni fondo ni menú, así que no abre ni cierra nada.
        if (t && t.closest && t.closest(".modal-content, .editor-overlay")) { p.kind = "modal"; return p; }
        const menu = t && t.closest && t.closest(".context-menu");
        if (menu) {
            p.kind = "menu";
            p.menu = menu.dataset.menu || "";
            p.parent = menu.dataset.parent || "";     // la lista que muestra
            // Si el clic cayó sobre un ítem, va también CUÁL: es lo que necesita
            // el universo para abrir las opciones de ese elemento.
            const item = t.closest(".menu-item");
            if (item) { p.name = item.textContent; p.index = Number(item.dataset.idx); }
            // El TÍTULO no es un elemento de la lista: pulsarlo va del MENÚ.
            else if (t.closest(".menu-titulo")) p.titulo = true;
            return p;
        }
        if (!t || t.nodeName === "HTML" || t.nodeName === "BODY") p.kind = "background";
        return p;
    },

    // Registro de los widgets abiertos.
    scene: {
        // Los menús forman un ÁRBOL: cada uno guarda de qué menú cuelga
        // ("" = raíz, nacida de un clic derecho en el fondo). El id lo pone el
        // shell, así dos aperturas de la misma lista son dos menús distintos.
        _menu: new Map(),      // id → { el, desde }
        _seq: 0,
        nuevoId() { return "m" + (++this._seq); },

        // Un menú tiene como mucho UN hijo abierto: elegir otro ítem cierra lo
        // que había abierto el anterior, en vez de dibujarse encima. Las RAÍCES
        // no se estorban entre sí — por eso cada clic derecho suma un menú.
        open(id, el, desde = "") {
            if (desde) this.closeChildren(desde);
            this._menu.set(id, { el, desde });
        },

        // Cerrar un menú se lleva por delante todo lo que colgaba de él.
        close(id) {
            const w = this._menu.get(id);
            if (!w) return;
            this.closeChildren(id);
            if (w.el?.remove) w.el.remove();
            this._menu.delete(id);
        },
        closeChildren(id) {
            for (const [k, w] of [...this._menu]) if (w.desde === id) this.close(k);
        },
        closeAll() { for (const k of [...this._menu.keys()]) this.close(k); },
    },

    // (solo del DEMO) bitácora: cada línea se anota en el átomo "logs #", que
    // se abre desde el menú principal como cualquier otra lista. No hay vista
    // aparte: la propia bitácora es un átomo del programa.
    log(html) {
        const bitacora = diarsaba.get("logs #");
        if (!Array.isArray(bitacora)) return;
        bitacora.unshift(html.replace(/<[^>]+>/g, ""));   // sin marcas: es texto
        while (bitacora.length > 40) bitacora.pop();
    },
};

/* ── EL SHELL · EL LIENZO DE UN PLACE ───────────────────────────────────────
   Aquí ya no hay formas. El shell no sabe qué es un círculo, ni un trazo, ni un
   texto: recibe HTML —que el universo arma con sus átomos "<"— y lo mete en el
   lienzo. Dos verbos, y ninguno menciona un color, una clase ni un estilo.

   Lo único que se queda es lo que no puede ser un átomo: qué nodo del documento
   es el lienzo, y cuánto hay que escalarlo para que quepa en ESTA ventana. Eso
   no es forma, es la ventana — y la ventana es del anfitrión.
   ────────────────────────────────────────────────────────────────────────── */

const lienzo = {

    _lienzo() { return document.getElementById("lienzo"); },

    // El escenario mide 200×200 y se escala a la ventana: así una escena escrita
    // en % y px se ve igual en cualquier pantalla. El 200 vive en el CSS —en
    // «estilo del lienzo {»—; aquí sólo se lee la ventana, que el universo no ve.
    _escalar() {
        const escala = Math.min(innerWidth, innerHeight) * 0.86 / 200;
        document.documentElement.style.setProperty("--escala", escala.toFixed(3));
    },

    // Vaciar el lienzo. Es lo primero que pasa al viajar a un place.
    limpiarLienzo(nombre = "") {
        const el = this._lienzo();
        if (el) el.innerHTML = "";
        this._escalar();
        document.getElementById("place-nombre").textContent = nombre;
    },

    // EL VERBO: añade HTML al lienzo. Lo que llega viene ya escapado por quien lo
    // armó —"plantilla ƒ" escapa cada valor salvo que se pida crudo—; el shell no
    // puede saber qué parte de un HTML es dato y qué parte es marcado, así que no
    // finge protegerlo. Insertar marcado es exactamente lo que dice el nombre.
    //
    // Un solo verbo para las tres formas de la escena y para las que añadas
    // mañana: dibujar algo nuevo es escribir un átomo "<", no tocar el shell.
    pintar(html) {
        const el = this._lienzo();
        if (!el) return false;
        el.insertAdjacentHTML("beforeend", String(html));
        return true;
    },
};

/* ── EL SHELL · EL EDITOR ───────────────────────────────────────────────────
   El editor del proyecto principal, traído tal cual: Monaco con selector de
   lenguaje (HTML/JS/CSS/Python/Go/JSON/Texto), guardar, cerrar y el asistente.
   Mismo marcado y mismas clases CSS que la app, para que un átomo o un estilo
   se puedan mover de un lado al otro sin traducir nada.

   Tres cosas cambian, y todas en la misma dirección: que no dependa de nadie.
     · Monaco y Font Awesome son CONFIGURACIÓN (crearHost({ vs, iconos })), no
       rutas adivinadas. Si no están, el editor sigue abriendo.
     · Sin Monaco se edita en un <textarea>, con la misma cabecera y el mismo
       selector. Se pierde el resaltado, no el editor.
     · El asistente llama a host.broker.ai(), no a una binding de Go. Sin
       anfitrión lo dice y no pasa nada más.

   El universo sólo ve host.editor(nombre, src, lang) → texto | null, y
   host.diff(titulo, a, b, lang) → bool. Igual que en CONTENEDOR.md.
   ────────────────────────────────────────────────────────────────────────── */

// Los lenguajes que ofrece el selector. Sin 'color': los iconos heredan
// currentColor (blanco). El lenguaje ya se distingue por su glifo y por el
// nombre de al lado.
const LENGUAJES = [
    { id: "html", name: "HTML", icon: "fab fa-html5" },
    { id: "javascript", name: "JavaScript", icon: "fab fa-js-square" },
    { id: "css", name: "CSS", icon: "fab fa-css3-alt" },
    { id: "python", name: "Python", icon: "fab fa-python" },
    { id: "go", name: "Go", icon: "fab fa-golang" },
    // JSON es el lenguaje de los átomos ":" — los que guardan una estructura.
    { id: "json", name: "JSON", icon: "fas fa-file-code" },
    { id: "plaintext", name: "Texto", icon: "fas fa-file-alt" },
];

// Los nombres cortos con que los átomos piden un lenguaje ("js", "text") y los
// largos que entiende Monaco. Es la misma tabla de la app.
const ALIAS = {
    html: "html", js: "javascript", javascript: "javascript", css: "css",
    py: "python", python: "python", go: "go", json: "json",
    text: "plaintext", plaintext: "plaintext",
};

const TEMA = "glass-dark";
const TEMA_DEF = {
    base: "vs-dark", inherit: true, rules: [],
    colors: {
        "editor.background": "#0b0b0b42",
        "editorGutter.background": "#0b0b0b24",
        "editorLineNumber.foreground": "#94a3b8",
        "editorLineNumber.activeForeground": "#f8fafc",
        "editorCursor.foreground": "#f8fafc",
        "editor.selectionBackground": "#ffffff18",
        "editor.inactiveSelectionBackground": "#ffffff10",
        "editor.lineHighlightBackground": "#ffffff08",
        "editor.lineHighlightBorder": "#00000000",
        "editorIndentGuide.background1": "#ffffff12",
        "editorIndentGuide.activeBackground1": "#ffffff22",
        "focusBorder": "#00000000",
        "contrastBorder": "#00000000",
        "contrastActiveBorder": "#00000000",
        "editorWidget.border": "#ffffff12",
        "scrollbarSlider.background": "#ffffff14",
        "scrollbarSlider.hoverBackground": "#ffffff24",
        "scrollbarSlider.activeBackground": "#ffffff30",
    },
};

const editor = {

    /* ── carga de lo de fuera: Monaco y los iconos ────────────────────────── */

    _monaco: null,
    _temaPuesto: false,
    _iconosPedidos: false,

    _cargarScript(src) {
        return new Promise((resolve) => {
            const s = document.createElement("script");
            s.src = src;
            s.onload = () => resolve(true);
            s.onerror = () => resolve(false);
            document.head.appendChild(s);
        });
    },

    // Los iconos del selector. Si no aparecen, los <i> quedan vacíos y el
    // nombre del lenguaje sigue ahí: se puede elegir igual. Por eso no se
    // espera a que carguen ni se avisa dos veces.
    _cargarIconos() {
        if (this._iconosPedidos) return;
        this._iconosPedidos = true;
        const candidatos = [];
        if (this._iconos) candidatos.push(this._iconos);
        else candidatos.push("../../public/fa/css/all.min.css", "/fa/css/all.min.css");
        for (const href of candidatos) {
            const link = document.createElement("link");
            link.rel = "stylesheet";
            link.href = new URL(href, location.href).href;
            link.onerror = () => link.remove();
            document.head.appendChild(link);
        }
    },

    _cargarMonaco() {
        if (this._monaco) return this._monaco;
        this._monaco = (async () => {
            if (window.monaco) return window.monaco;
            // Dónde buscar Monaco. Si el anfitrión lo dijo al crear el host
            // (crearHost({ vs })), se usa eso y no se adivina — es lo que hará
            // Tauri, que sirve sus assets desde donde quiera. Si no, se prueban
            // las rutas de siempre: la raíz servida (donde lo pone Vite y donde
            // lo pide la app real) y public/vs del repo. Gana la primera que
            // conteste, y si no contesta ninguna se edita en un textarea.
            const bases = [];
            if (this._vs) bases.push(new URL(this._vs, location.href).href);
            if (location.protocol !== "file:") bases.push(new URL("/", location.href).href);
            bases.push(new URL("../../public/", location.href).href);
            let base = null;
            for (const b of bases) if (await this._cargarScript(b + "vs/loader.js")) { base = b; break; }
            if (!base) throw new Error("no se encontró vs/loader.js en: " + bases.join(" , "));

            const vs = base + "vs";
            window.require.config({ paths: { vs } });
            // El worker se pide por data: URL, igual que en la app. Si el
            // navegador lo bloquea, Monaco se cae solo al hilo principal y
            // sigue editando.
            window.MonacoEnvironment = {
                getWorkerUrl: () => "data:text/javascript;charset=utf-8," + encodeURIComponent(
                    `self.MonacoEnvironment={baseUrl:'${base}'};` +
                    `importScripts('${vs}/base/worker/workerMain.js');`),
            };
            return new Promise((resolve, reject) => {
                window.require(["vs/editor/editor.main"], () => resolve(window.monaco), reject);
            });
        })();
        return this._monaco;
    },

    /* ── lenguajes ────────────────────────────────────────────────────────── */

    // El lenguaje que pide un átomo, resuelto a una entrada del selector. Lo
    // que no se reconoce cae en JavaScript, como en la app.
    _lenguaje(lang) {
        const id = ALIAS[lang] || lang;
        return LENGUAJES.find((l) => l.id === id) || LENGUAJES.find((l) => l.id === "javascript");
    },
    _monacoLang(lang) { return ALIAS[lang] || lang; },

    /* ── el overlay ───────────────────────────────────────────────────────── */

    // El título es el NOMBRE del átomo. Un átomo llamado "<img onerror=...>"
    // (p. ej. de un programa compartido) inyectaría HTML aquí; se escapa. Lo
    // demás de la plantilla son constantes.
    _crearOverlay(titulo, lenguaje, conAsistente) {
        const overlay = document.createElement("div");
        overlay.className = "editor-overlay";
        const esc = (s) => String(s).replace(/[&<>"']/g, (c) =>
            ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
        overlay.innerHTML = `
        <div class="editor-modal">
            <div class="editor-header">
                <div class="editor-title">
                    <div class="language-selector">
                        <button class="language-button" type="button" title="Seleccionar lenguaje">
                            <i class="${lenguaje.icon}"></i>
                            <span class="language-name">${lenguaje.name}</span>
                        </button>
                        <div class="language-dropdown">
                            ${LENGUAJES.map((l) => `
                                <button class="dropdown-item" data-lang="${l.id}">
                                    <i class="${l.icon}"></i>
                                    <span>${l.name}</span>
                                </button>
                            `).join("")}
                        </div>
                    </div>
                    <span class="modal-title">${esc(titulo)}</span>
                </div>
                <div class="editor-controls">
                    ${conAsistente ? `<button class="ai-button" title="Asistente IA (Ctrl+I)">
                        <i class="fas fa-wand-magic-sparkles"></i>
                    </button>` : ""}
                    <button class="save-button" title="Guardar (Ctrl+S)">
                        <i class="fas fa-save"></i>
                    </button>
                    <button class="close-button" title="Cerrar">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            </div>
            <div class="monaco-container" style="width:100%;height:100%;"></div>
        </div>`;
        return overlay;
    },

    _partes(overlay) {
        return {
            modal: overlay.querySelector(".editor-modal"),
            container: overlay.querySelector(".monaco-container"),
            selector: overlay.querySelector(".language-selector"),
            boton: overlay.querySelector(".language-button"),
            icono: overlay.querySelector(".language-button i"),
            nombre: overlay.querySelector(".language-name"),
            dropdown: overlay.querySelector(".language-dropdown"),
            items: overlay.querySelectorAll(".dropdown-item"),
            guardar: overlay.querySelector(".save-button"),
            cerrar: overlay.querySelector(".close-button"),
            ai: overlay.querySelector(".ai-button"),
        };
    },

    /* ── el asistente ─────────────────────────────────────────────────────── */

    // Quita los ``` con que un modelo suele envolver el código.
    _sinCercas(texto) {
        const t = String(texto).trim();
        const m = t.match(/^```[a-zA-Z0-9]*\s*\n([\s\S]*?)\n```$/);
        return m ? m[1] : t;
    },

    // Pide la instrucción dentro del propio editor, anclada abajo.
    _pedirInstruccion(ancla) {
        return new Promise((resolve) => {
            const wrap = document.createElement("div");
            wrap.className = "ai-prompt";
            wrap.innerHTML = `
                <input type="text" class="ai-prompt-input" placeholder="¿Qué quieres que haga la IA con este átomo?" spellcheck="false" />
                <button class="ai-prompt-send" type="button" title="Enviar (Enter)"><i class="fas fa-arrow-up"></i></button>`;
            ancla.appendChild(wrap);
            const input = wrap.querySelector(".ai-prompt-input");
            const send = wrap.querySelector(".ai-prompt-send");
            const fin = (v) => { wrap.remove(); resolve(v); };
            input.addEventListener("keydown", (e) => {
                e.stopPropagation();
                if (e.key === "Enter") fin(input.value.trim() || null);
                else if (e.key === "Escape") fin(null);
            });
            send.addEventListener("click", () => fin(input.value.trim() || null));
            input.focus();
        });
    },

    // El asistente pasa por el BROKER: aquí no hay ninguna binding de Go. El
    // "system" opcional viene del átomo "ai system §" — es un dato del
    // programa, editable desde su propio menú.
    async _asistir(leer, escribir, partes, lang) {
        if (this._aiOcupado) return;
        const instruccion = await this._pedirInstruccion(partes.modal);
        if (!instruccion) return;

        this._aiOcupado = true;
        const icono = partes.ai.querySelector("i");
        const antes = icono.className;
        icono.className = "fas fa-spinner fa-spin";
        partes.ai.disabled = true;
        try {
            const sistema = typeof window.diarsaba?.get("ai system §") === "string"
                ? window.diarsaba.get("ai system §") : "";
            const r = await window.host.broker.ai(leer(), lang, instruccion, sistema);
            // El broker nulo contesta { ok:false, motivo }. Un anfitrión de
            // verdad devuelve el texto. Se distinguen así, sin preguntar quién es.
            if (r && r.ok === false) window.host.log("· el asistente necesita anfitrión (" + r.motivo + ")");
            else escribir(this._sinCercas(typeof r === "string" ? r : (r?.valor ?? "")));
        } catch (e) {
            window.host.notify("Error de IA: " + (e?.message || e));
        } finally {
            icono.className = antes;
            partes.ai.disabled = false;
            this._aiOcupado = false;
        }
    },

    /* ── EL VERBO ─────────────────────────────────────────────────────────── */

    // Abre el editor. Resuelve el texto (Guardar / Ctrl+S) o null (Cerrar /
    // Esc / clic fuera). Cancelar resuelve null y no "": vaciar a propósito y
    // cancelar no pueden ser lo mismo — un editor de lista leería "" como
    // "borra la lista".
    async editor(nombre, src = "", lang = "javascript") {
        this._cargarIconos();
        const monaco = await this._cargarMonaco().catch((e) => {
            console.warn("[shell] Monaco no disponible:", e.message);
            return null;                       // se edita en un textarea y ya
        });

        return new Promise((resolve) => {
            const inicial = this._lenguaje(lang);
            const overlay = this._crearOverlay(nombre, inicial, true);
            document.body.append(overlay);
            const partes = this._partes(overlay);
            let actual = inicial.id;

            const limpiezas = [];
            const escuchar = (donde, evento, fn) => {
                donde.addEventListener(evento, fn);
                limpiezas.push(() => donde.removeEventListener(evento, fn));
            };

            // Monaco o textarea: de aquí abajo, todo habla por leer/escribir.
            let ed = null, leer, escribir, enfocar;
            if (monaco) {
                if (!this._temaPuesto) { monaco.editor.defineTheme(TEMA, TEMA_DEF); this._temaPuesto = true; }
                ed = monaco.editor.create(partes.container, {
                    value: src, language: this._monacoLang(inicial.id), theme: TEMA,
                    automaticLayout: true, fontSize: 14,
                    fontFamily: getComputedStyle(document.body).fontFamily,
                    scrollBeyondLastLine: false, minimap: { enabled: false },
                    lineNumbers: "on", roundedSelection: false, tabSize: 4,
                });
                leer = () => ed.getValue();
                escribir = (t) => {
                    // Si hay selección, se sustituye sólo eso: es lo que hace la
                    // app, y permite pedirle a la IA un trozo y no el átomo entero.
                    const sel = ed.getSelection();
                    if (sel && !sel.isEmpty()) ed.executeEdits("ai", [{ range: sel, text: t, forceMoveMarkers: true }]);
                    else ed.setValue(t);
                };
                enfocar = () => ed.focus();
            } else {
                const ta = document.createElement("textarea");
                ta.value = src; ta.spellcheck = false;
                partes.container.append(ta);
                leer = () => ta.value;
                escribir = (t) => { ta.value = t; };
                enfocar = () => ta.focus();
            }

            const ocultarLista = () => partes.dropdown.classList.remove("show");
            const cerrar = (v) => {
                limpiezas.forEach((f) => f());
                if (ed) ed.dispose();          // Monaco guarda cada instancia en un
                overlay.remove();              // registro propio: hay que soltarla
                resolve(v);
            };

            // Cambiar de lenguaje: el botón y el resaltado. Sin Monaco sólo
            // cambia el botón — no hay resaltado que cambiar, pero la elección
            // sigue teniendo sentido para quien lo lee.
            const cambiar = (id) => {
                const nuevo = this._lenguaje(id);
                if (!nuevo || nuevo.id === actual) { ocultarLista(); return; }
                partes.icono.className = nuevo.icon;
                partes.nombre.textContent = nuevo.name;
                if (ed) monaco.editor.setModelLanguage(ed.getModel(), this._monacoLang(nuevo.id));
                actual = nuevo.id;
                ocultarLista();
            };

            escuchar(partes.guardar, "click", () => cerrar(leer()));
            escuchar(partes.cerrar, "click", () => cerrar(null));
            escuchar(partes.ai, "click", () => this._asistir(leer, escribir, partes, actual));
            escuchar(partes.boton, "click", (e) => { e.stopPropagation(); partes.dropdown.classList.toggle("show"); });
            partes.items.forEach((item) => escuchar(item, "click", (e) => {
                e.stopPropagation();
                cambiar(item.dataset.lang);
            }));
            escuchar(document, "click", (e) => { if (!partes.selector.contains(e.target)) ocultarLista(); });
            escuchar(overlay, "click", (e) => { if (e.target === overlay) cerrar(null); });

            // El Esc del editor no debe llegar al de la ventana (que barre los
            // menús): primero cierra la lista de lenguajes, luego el editor, y
            // en ningún caso sigue subiendo.
            escuchar(overlay, "keydown", (e) => {
                if (e.key !== "Escape") return;
                e.stopPropagation();
                if (partes.dropdown.classList.contains("show")) { ocultarLista(); return; }
                cerrar(null);
            });

            if (ed) {
                ed.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.KeyS, () => cerrar(leer()));
                ed.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.KeyI, () => this._asistir(leer, escribir, partes, actual));
                ed.addCommand(monaco.KeyCode.Escape, () => {
                    if (partes.dropdown.classList.contains("show")) { ocultarLista(); return; }
                    cerrar(null);
                });
            }
            enfocar();
        });
    },

    // Diff de sólo lectura: izquierda la versión elegida, derecha la actual.
    // Resuelve true si se pulsa restaurar, false al cerrar. Sin Monaco no se
    // finge con dos textareas: se dice que no se puede y se resuelve false.
    async diff(titulo, original = "", modificado = "", lang = "javascript") {
        const monaco = await this._cargarMonaco().catch(() => null);
        if (!monaco) {
            window.host.log("· el diff necesita Monaco; no está disponible");
            return false;
        }
        this._cargarIconos();
        return new Promise((resolve) => {
            const overlay = this._crearOverlay(titulo, this._lenguaje(lang), false);
            // Un diff no se edita: el botón de guardar pasa a ser "restaurar".
            const partes = this._partes(overlay);
            partes.guardar.title = "Restaurar esta versión";
            partes.selector.style.pointerEvents = "none";
            document.body.append(overlay);

            if (!this._temaPuesto) { monaco.editor.defineTheme(TEMA, TEMA_DEF); this._temaPuesto = true; }
            const l = this._monacoLang(lang);
            const izq = monaco.editor.createModel(original, l);
            const der = monaco.editor.createModel(modificado, l);
            const d = monaco.editor.createDiffEditor(partes.container, {
                theme: TEMA, automaticLayout: true, readOnly: true,
                renderSideBySide: true, minimap: { enabled: false }, fontSize: 13,
            });
            d.setModel({ original: izq, modified: der });

            const cerrar = (v) => {
                d.dispose(); izq.dispose(); der.dispose();
                overlay.remove(); resolve(v);
            };
            partes.guardar.addEventListener("click", () => cerrar(true));
            partes.cerrar.addEventListener("click", () => cerrar(false));
            overlay.addEventListener("keydown", (e) => {
                if (e.key !== "Escape") return;
                e.stopPropagation();
                cerrar(false);
            });
        });
    },
};

/* ── EL SHELL · LOS ESTILOS ─────────────────────────────────────────────────
   El estilo no es del HTML: es del PROGRAMA. Cada átomo que acaba en "{" es
   CSS, y aquí se le da un <style> propio. Esto es todo lo que el shell sabe de
   estilo — ni un selector, ni un color: sólo cómo llevar un texto al documento.

   Portado de "install style manager" / host.installStyles de la app real, con
   el mismo truco: se envuelve diarsaba.set para que GUARDAR un "{" repinte al
   instante. Por eso editar «estilo del menú {» desde su propio menú cambia el
   menú mientras lo miras, sin recargar nada.

   Y por eso el shell puede encogerse: lo que antes era un estilo.css invisible
   ahora son cinco átomos que el programa lee, abre y reescribe.
   ────────────────────────────────────────────────────────────────────────── */


// El id del <style> de un átomo. Del nombre («estilo del menú {») sale un id
// estable («diarsaba-estilo-estilo_del_men_»), así que volver a sembrar el mismo
// átomo reusa su etiqueta en vez de apilar otra.
const idDeAtomo = (clave) => {
    const base = String(clave).replace(/\s*\{$/, "").trim();
    return "diarsaba-style-" + base.replace(/[^\w-]/g, "_").replace(/^_+|_+$/g, "");
};

const aplicar = (clave, valor) => {
    const id = idDeAtomo(clave);
    let el = document.getElementById(id);
    if (!el) {
        el = document.createElement("style");
        el.id = id;
        document.head.appendChild(el);
    }
    el.textContent = typeof valor === "string" ? valor : "";
};

const estilos = {
    // Sincroniza los "{" que ya hay y deja enganchado el repintado de los que
    // vengan. Lo llama el universo (por "install style manager ƒ"), no el HTML:
    // es el programa el que decide cuándo se pone su ropa.
    installStyles() {
        let n = 0;
        for (const [clave, valor] of diarsaba.entries())
            if (typeof clave === "string" && clave.endsWith("{")) { aplicar(clave, valor); n++; }

        // Una vez. Si se llamara dos veces se envolvería el envoltorio, y cada
        // set haría el trabajo dos veces.
        if (!this._enganchado) {
            const setOriginal = diarsaba.set.bind(diarsaba);
            diarsaba.set = (clave, valor) => {
                setOriginal(clave, valor);
                try {
                    if (typeof clave === "string" && clave.endsWith("{")) aplicar(clave, valor);
                } catch (e) {
                    console.error("[shell] estilo «" + clave + "»:", e);
                }
                return diarsaba;
            };
            this._enganchado = true;
        }
        return n;
    },
};

/* ── EL SHELL · EL AISLAMIENTO ──────────────────────────────────────────────
   Correr un átomo que no es de fiar. Aquí es un Web Worker con un reloj
   encima; en la app puede ser workerd o el sandbox que el anfitrión ofrezca.
   El universo sólo ve el verbo host.worker(fuente, args, ms) y un veredicto.
   ────────────────────────────────────────────────────────────────────────── */

const aislamiento = {
    /* ── EL AISLAMIENTO (worker) ───────────────────────────────────────────
       Correr un átomo que NO es de fiar: puede colgarse, reventar o intentar
       tocar lo que no es suyo. Vive en un worker, que es un mundo aparte —sin
       document, sin el Map, sin nada de aquí—, y con un reloj encima: si no
       contesta a tiempo se le termina y ya está. Aquí es un Web Worker; en la
       app (Go/Wails) el mismo verbo lo cumple workerd.

       Lo que vuelve son DATOS. Si el átomo quiere dibujar, devuelve una lista
       de acciones y las pinta el universo de casa: nada del sandbox llega al
       DOM, ni siquiera indirectamente.                                       */

    // El único código que se le confía al worker: recibe una fuente, la
    // compila allí dentro y devuelve lo que salga —o el error.
    _sandbox: `
self.onmessage = (e) => {
    const { src, args } = e.data;
    try {
        const f = (new Function("return (" + src + ")"))();
        if (typeof f !== "function") { self.postMessage({ ok: false, motivo: "no es función" }); return; }
        const valor = f.apply(null, args || []);
        // Sólo lo estructurable cruza de vuelta: una función o un elemento
        // no pueden viajar por un postMessage, y eso es una garantía, no un
        // límite.
        self.postMessage({ ok: true, valor: JSON.parse(JSON.stringify(valor ?? null)) });
    } catch (err) {
        self.postMessage({ ok: false, motivo: "reventó", error: String((err && err.message) || err) });
    }
};`,

    // Corre una fuente aislada y resuelve SIEMPRE, con un veredicto:
    //   { ok:true, valor }                        · contestó
    //   { ok:false, motivo:"colgada" }            · se le terminó el tiempo
    //   { ok:false, motivo:"reventó", error }     · lanzó
    //   { ok:false, motivo:"sin aislamiento" }    · no hay worker: NO se ejecuta
    // Nunca lanza y nunca se queda esperando: por eso un while(true) no se
    // lleva por delante la página.
    async worker(src, args = [], ms = 800) {
        // El reloj se pone en marcha DESPUÉS de tener el worker: arrancarlo cuesta
        // unos milisegundos que no son del átomo. Aun así lo que se mide es tiempo
        // de pared, así que un "colgada" puede pasarse del plazo: el aviso llega
        // cuando el hilo de casa vuelve a mirar.
        let t0 = performance.now();
        const tiempo = () => Math.round(performance.now() - t0);
        let w = null, url = null;
        try {
            url = URL.createObjectURL(new Blob([this._sandbox], { type: "text/javascript" }));
            w = new Worker(url);
        } catch (e) {
            // Sin sandbox no se ejecuta NADA. Correr en el hilo principal algo
            // que puede no terminar sería exactamente lo que se quiere evitar.
            if (url) URL.revokeObjectURL(url);
            return { ok: false, motivo: "sin aislamiento", error: String(e.message || e), ms: tiempo() };
        }
        t0 = performance.now();
        return new Promise((resolve) => {
            let cerrado = false;
            const cerrar = (r) => {
                if (cerrado) return;
                cerrado = true;
                clearTimeout(reloj);
                w.terminate();                 // esto es lo que mata un bucle infinito
                URL.revokeObjectURL(url);
                resolve({ ...r, ms: tiempo() });
            };
            const reloj = setTimeout(() => cerrar({ ok: false, motivo: "colgada" }), ms);
            w.onmessage = (e) => cerrar(e.data);
            w.onerror = (e) => {
                if (e.preventDefault) e.preventDefault();
                cerrar({ ok: false, motivo: "reventó", error: e.message || "error en el worker" });
            };
            w.postMessage({ src, args });
        });
    },
};

/* ── EL SHELL · EL BROKER ───────────────────────────────────────────────────
   El canal 3 del protocolo: lo que el universo no puede hacer solo porque
   vive fuera de él — guardar, cargar, hablar con otra máquina.

   Aquí está NULO a propósito. Cada verbo existe, contesta algo honesto y lo
   apunta en la bitácora, así que el programa entero funciona sin anfitrión: se
   abre en un navegador y no falta nada más que la persistencia y la red. Eso
   es lo que hace este lado portable — no hay un Go escondido del que dependa.

   PARA ENCHUFARLO EN TAURI: no se toca ningún átomo. Se implementa este mismo
   objeto contra invoke() y se pasa a crearHost({ broker }). Los átomos siguen
   diciendo host.broker.kv.set(...) y no se enteran de quién contesta:

       import { invoke } from "@tauri-apps/api/core";
       const brokerTauri = {
           kv: {
               set: (k, v) => invoke("kv_set", { clave: k, valor: v }),
               get: (k)    => invoke("kv_get", { clave: k }),
               ...
           },
           p2p: {                                    // tu librería de Go, aparte
               anunciar: (a)     => invoke("p2p_anunciar", a),
               abrirStream: (id) => invoke("p2p_abrir_stream", { id }),
               ...
           },
           al: (evento, cb) => escuchar(evento, cb),  // eventos entrantes
       };

   Los nombres de abajo salen del inventario del borde de CONTENEDOR.md
   (kv.set/get/delete/history/restore, export/save/load, p2p.*, ai, reload),
   con la firma mínima. Ampliar es añadir un verbo, no rediseñar nada.
   ────────────────────────────────────────────────────────────────────────── */

// Lo que devuelve un verbo que no está enchufado. No lanza: un anfitrión
// ausente es un dato, no un error — igual que un átomo que no termina.
const sinAnfitrion = (verbo) => {
    if (window.host && window.host.log) window.host.log("· sin anfitrión: <b>" + verbo + "</b>");
    return { ok: false, motivo: "sin anfitrión", verbo };
};

const brokerNulo = {
    nombre: "nulo",

    // Almacén por clave. En la app real es un bbolt por universo; en Tauri, lo
    // que decidas (sqlite, ficheros, el store de Tauri).
    kv: {
        set: (clave, valor) => sinAnfitrion("kv.set " + clave),
        get: (clave) => sinAnfitrion("kv.get " + clave),
        delete: (clave) => sinAnfitrion("kv.delete " + clave),
        history: (clave) => sinAnfitrion("kv.history " + clave),
        restore: (clave, version) => sinAnfitrion("kv.restore " + clave),
    },

    // El programa entero, entrando y saliendo. "export" no necesita anfitrión:
    // el universo ya sabe serializarse, así que esto se puede resolver aquí y
    // es lo único del broker que funciona de verdad sin backend.
    exportar: () => {
        const salida = {};
        for (const [k, v] of window.diarsaba) {
            if (typeof v === "function") salida[k] = v.toString();
            else if (typeof v !== "undefined") salida[k] = v;
        }
        return { ok: true, valor: salida };
    },
    guardar: () => sinAnfitrion("guardar"),
    cargar: () => sinAnfitrion("cargar"),

    // La única pieza que te llevas de Go, y vive detrás de estos verbos: el
    // universo nunca ve un socket, sólo pide "anuncia" o "abre un stream".
    p2p: {
        arrancar: (opciones) => sinAnfitrion("p2p.arrancar"),
        anunciar: (anuncio) => sinAnfitrion("p2p.anunciar"),
        abrirStream: (par) => sinAnfitrion("p2p.abrirStream"),
        escribir: (id, datos) => sinAnfitrion("p2p.escribir"),
        leer: (id) => sinAnfitrion("p2p.leer"),
        cerrar: (id) => sinAnfitrion("p2p.cerrar"),
    },

    // El asistente del editor. Igual que el resto: un verbo, no una integración.
    ai: (codigo, lang, instruccion, system) => sinAnfitrion("ai"),

    // Recargar el anfitrión (en un navegador, la página).
    recargar: () => location.reload(),

    // Eventos que llegan de fuera (un stream p2p entrante, por ejemplo). El
    // universo registra un nombre y una función; el anfitrión la llama. Sin
    // anfitrión no llega nada, y registrarse no cuesta nada.
    _oyentes: new Map(),
    al(evento, fn) {
        if (!this._oyentes.has(evento)) this._oyentes.set(evento, []);
        this._oyentes.get(evento).push(fn);
        return () => {
            const l = this._oyentes.get(evento) || [];
            const i = l.indexOf(fn);
            if (i >= 0) l.splice(i, 1);
        };
    },
    // Lo llama el ANFITRIÓN para entregar un evento. Está aquí, y no en el
    // universo, porque quien lo dispara es de fuera.
    emitir(evento, datos) {
        for (const fn of this._oyentes.get(evento) || []) {
            try { fn(datos); } catch (e) { console.warn("[broker] oyente de", evento, e); }
        }
    },
};

/* ═══════════════════════════════════════════════════════════════════════════
   EL SHELL — el borde entero, en un objeto.

   El universo le habla por verbos y nunca ve un elemento del DOM. Se ensambla
   de piezas: widgets (menús/listas/modal/eventos), lienzo (los tres verbos de
   dibujo), editor (Monaco), aislamiento (el worker) y broker (lo de fuera).

   Cambiar de anfitrión es cambiar piezas, no átomos. Un shell de Tauri con
   Three.js en vez de divs sería este mismo archivo con otro lienzo.js.
   ═══════════════════════════════════════════════════════════════════════════ */







function crearHost({ broker = brokerNulo, vs = null, iconos = null } = {}) {
    const host = {
        ...widgets,
        ...lienzo,
        ...editor,
        ...estilos,
        ...aislamiento,
        broker,
        // Dónde está Monaco, y dónde los iconos del selector de lenguaje. Si se
        // pasan, se usan esas rutas y no se adivina nada; si no, el editor
        // prueba las de siempre. Y si no encuentra ninguna, edita en un textarea
        // con los iconos vacíos: el editor nunca es motivo de que nada falle.
        _vs: vs,
        _iconos: iconos,
    };

    // Global a propósito: los átomos son TEXTO compilado con new Function, así
    // que su ámbito es el global. Un átomo que dice host.menu(...) sólo puede
    // verlo aquí. Es el mismo trato que el kernel.
    window.host = host;
    return host;
}

function sembrar(atomos) {
    let n = 0;
    for (const [nombre, valor] of Object.entries(atomos)) {
        try {
            diarsaba.set(nombre, nombre.endsWith("ƒ") ? createFunction(valor) : valor);
            n++;
        } catch (e) {
            // Un átomo que no compila no se lleva por delante a los demás: se
            // queda fuera y se dice cuál. Sembrar a medias es mejor que no
            // arrancar, porque el que falta se puede escribir desde el menú.
            console.warn(`[cargador] «${nombre}» no compila, se queda fuera:`, e.message);
        }
    }
    return n;
}

/* ═══════════════════════════════════════════════════════════════════════════
   EL ARRANQUE — el único archivo que sabe en qué anfitrión estamos.

   Monta el shell, siembra el universo, entrega los gestos y viaja a un place.
   Todo lo demás (kernel, shell, átomos) no sabe nada de esto: para llevar el
   paquete a otro anfitrión se cambia ESTE archivo y nada más.
   ═══════════════════════════════════════════════════════════════════════════ */




// ── 1. EL SHELL ────────────────────────────────────────────────────────────
// En Tauri: crearHost({ broker: brokerTauri, vs: "/vs/" }). Ni un átomo cambia.
const host = crearHost();

// ── 2. EL UNIVERSO ─────────────────────────────────────────────────────────
const sembrados = sembrar(ATOMOS);   // incrustados por empaquetar.mjs

// ── 3. EL ESTILO ───────────────────────────────────────────────────────────
// Lo pone el PROGRAMA, no el HTML: los átomos "{" se vuelven <style>. Y queda
// enganchado, así que editar «estilo del menú {» desde su propio menú repinta.
const estilos = diarsaba.get("install style manager ƒ")();

// ── 4. LOS GESTOS ──────────────────────────────────────────────────────────
// Entran por aquí y se entregan al universo ya CLASIFICADOS por host.hit(). En
// la app real esto vive en "on start ƒ"; con el worker, la entrega será un
// postMessage y este bloque es justo el que se muda al shell.
addEventListener("contextmenu", (e) => e.preventDefault());
// Esc barre TODO (menús + listas): es lo que hace el cambio de place con
// host.clearMenus(true). De uno en uno, cada menú se cierra con su "cerrar ƒ".
addEventListener("keydown", (e) => { if (e.key === "Escape") host.clearMenus(true); });
addEventListener("pointerup", (e) => {
    diarsaba.set("pointer up event", host.hit(e));
    if (e.button === 0) diarsaba.get("handle click ƒ")();
    if (e.button === 2) diarsaba.get("show context menu ƒ")();
});
addEventListener("pointermove", (e) => { host._px = e.clientX; host._py = e.clientY; });
// El escenario se reajusta con la ventana: la escena no se recalcula, sólo se
// escala — es la misma, más grande.
addEventListener("resize", () => host._escalar());

// ── 5. EL PLACE ────────────────────────────────────────────────────────────
// Arrancar EN un place: el programa siempre está en algún sitio. Se viaja como
// se viajaría desde el menú, con el mismo átomo.
diarsaba.get("viajar a place ƒ")("escena @");

host.log(sembrados + " átomos · " + estilos + " estilos · broker «" + host.broker.nombre + "»");
host.log("listo — clic derecho en el fondo abre un menú; sobre un ítem, sus opciones");
    </script>
