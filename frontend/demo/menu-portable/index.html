<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <title>DIARSABA — el paquete portable (shell + universo)</title>
    <!-- Sin hoja de estilo: el estilo son átomos "{" del propio programa, y los
         instala el universo al arrancar. Hay un parpadeo hasta que siembra: es
         el precio de que el estilo se pueda reescribir desde su propio menú. -->
</head>

<body>

    <!-- El lienzo del place activo. Está vacío: lo pinta el shell cuando el
         universo dice a qué "@" se viaja. -->
    <div id="lienzo"></div>
    <span id="place-nombre"></span>

    <!-- Lo único que hay en el HTML. Todo lo demás son módulos y datos: el HTML
         no sabe nada del programa, y por eso el programa no depende del HTML. -->
    <script type="module" src="src/arranque.js"></script>
</body>

</html>
